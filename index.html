const TITLE_TIERS = [
  {name:'みならい',     from:1,  to:5},
  {name:'いちにんまえ', from:6,  to:14},
  {name:'たつじん',     from:15, to:29},
  {name:'でんせつ',     from:30, to:99}
];
function titleTier(lv){ return lv >= 30 ? 3 : lv >= 15 ? 2 : lv >= 6 ? 1 : 0; }
/* その人が でて くる きろく */
function advPlays(name){
  return cardPlays().filter(r => playMembers(r.pl).indexOf(name) >= 0)
    .sort((a,b) => String(a.pl.d||'').localeCompare(String(b.pl.d||'')));
}
function advLevel(n){ return Math.min(99, 1 + Math.floor(Math.sqrt(n * 6))); }
function advNextLevelAt(lv){ for(let n = 0; n < 100000; n++){ if(advLevel(n) > lv) return n; } return 0; }
const hasTag = (g, t) => (g.tags || []).indexOf(t) >= 0;
/* 0〜99 に おさめる（おおいほど ゆっくり のびる） */
const advScale = (x, k) => Math.round(99 * (1 - Math.exp(-x / k)));

function adventurer(name){
  const ps = advPlays(name);
  const wins = ps.filter(r => r.pl.w === name);
  const vs = ps.filter(r => !hasTag(r.g,'協力'));
  const vsWins = vs.filter(r => r.pl.w === name).length;
  const games = {}, mates = {}, winsBy = {}, days = {};
  let minutes = 0;
  ps.forEach(r => {
    games[r.g.id] = (games[r.g.id] || 0) + 1;
    if(r.pl.w === name) winsBy[r.g.id] = (winsBy[r.g.id] || 0) + 1;
    playMembers(r.pl).forEach(m => { if(m !== name) mates[m] = (mates[m] || 0) + 1; });
    minutes += Number(r.g.playTime) || 0;
    if(r.pl.d) days[r.pl.d] = (days[r.pl.d] || 0) + 1;
  });
  const cnt = f => ps.filter(r => f(r.g)).length;
  const raw = {
    /* かちは 勝率に 回数の おもみを かける（1かい 1しょう で 99 に ならない） */
    atk:   vs.length ? (vsWins / vs.length) * Math.min(1, vs.length / 8) * 3 + vsWins * 0.15 : 0,
    int:   cnt(g => hasTag(g,'頭脳戦') || hasTag(g,'重量級') || (Number(g.difficulty)||0) >= 4) + wins.filter(r => hasTag(r.g,'頭脳戦')).length,
    bond:  cnt(g => hasTag(g,'協力')),
    trick: cnt(g => hasTag(g,'正体隠匿')) + wins.filter(r => hasTag(r.g,'正体隠匿')).length,
    luck:  cnt(g => hasTag(g,'運要素')) + wins.filter(r => hasTag(r.g,'運要素')).length * 0.5,
    party: cnt(g => hasTag(g,'盛り上がる') || hasTag(g,'パーティー')),
    spd:   cnt(g => hasTag(g,'軽量級') || ((Number(g.playTime)||99) <= 15)),
    hp:    minutes,
    know:  Object.keys(games).length,
    charm: Object.keys(mates).length
  };
  const K = {atk:1.6, int:10, bond:8, trick:8, luck:10, party:10, spd:10, hp:900, know:15, charm:8};
  const stats = {};
  ADV_STATS.forEach(st => { stats[st.id] = advScale(raw[st.id], K[st.id]); });

  const topGame = (obj) => {
    const id = Object.keys(obj).sort((a,b) => obj[b] - obj[a])[0];
    return id ? state.games.find(g => g.id === id) : null;
  };
  const mate = Object.keys(mates).sort((a,b) => mates[b] - mates[a])[0] || '';

  /* れんしょう（おなじ ひの じゅんばんは きろく じゅん） */
  let streak = 0, best = 0;
  ps.forEach(r => { if(r.pl.w === name){ streak++; best = Math.max(best, streak); } else if(r.pl.w){ streak = 0; } });
  const genres = {};
  ps.forEach(r => (r.g.tags || []).forEach(t => {
    if(state.tags.some(x => x.name === t && x.category === 'ジャンル')) genres[t] = 1;
  }));
  const maxDay = Math.max(0, ...Object.values(days));

  const badges = [
    {name:'はじめての ぼうけん', ok: ps.length >= 1,   hint:'1かい あそぶ'},
    {name:'はじめての しょうり', ok: wins.length >= 1, hint:'1かい かつ'},
    {name:'10かいの ぼうけん',   ok: ps.length >= 10,  hint:'10かい あそぶ'},
    {name:'ベテラン ぼうけんしゃ', ok: ps.length >= 50, hint:'50かい あそぶ'},
    {name:'3れんしょう',         ok: best >= 3,        hint:'3かい つづけて かつ'},
    {name:'10しゅるい せいは',   ok: Object.keys(games).length >= 10, hint:'10しゅるいの ゲームで あそぶ'},
    {name:'ジャンル マスター',   ok: Object.keys(genres).length >= 5, hint:'5つの ジャンルで あそぶ'},
    {name:'ゆうじょうの あかし', ok: raw.bond >= 10,   hint:'協力ゲームを 10かい'},
    {name:'さかばの なかまたち', ok: raw.charm >= 5,   hint:'5人と いっしょに あそぶ'},
    {name:'あそびつくしの 1にち', ok: maxDay >= 5,     hint:'1日に 5ゲーム あそぶ'},
    {name:'じゅうりょうきゅうの ちょうせん', ok: Object.keys(games).some(id => { const g = state.games.find(x => x.id === id); return g && hasTag(g,'重量級'); }), hint:'重量級で あそぶ'}
  ];

  return {
    name, plays: ps.length, mine: ps.filter(r => r.mine).length, wins: wins.length,
    rate: vs.length ? Math.round(vsWins / vs.length * 100) : null,
    minutes, stats, badges, best,
    kinds: Object.keys(games).length,
    fav: topGame(games), strong: topGame(winsBy), mate,
    last: ps.length ? ps[ps.length-1].pl.d : ''
  };
}
/* ---------------- ジョブ ----------------
   いちおしの ゲーム（3つまで）から きまる。
   1. ゲームごとに「その ゲームらしさ」を あらわす ジョブを 1つ きめる
      （あそびかたの タグ ＞ パーティー ＞ ふんいきの タグ の じゅんに おもく みる）
   2. 3つの ゲームで たすうけつ。ぜんぶ ちがえば「ゆうしゃ」 */
const JOBS = [
  {id:'thief',    name:'とうぞく',     tags:{'正体隠匿':3}, desc:'うそと かけひきで しょうぶ する（正体隠匿・ブラフ）'},
  {id:'priest',   name:'そうりょ',     tags:{'協力':3}, desc:'みんなで ちからを あわせる（協力）'},
  {id:'merchant', name:'しょうにん',   tags:{'デッキ構築':3,'ドラフト':3}, desc:'くみたてて ふやして いく（デッキ構築・ドラフト）'},
  {id:'seer',     name:'うらないし',   tags:{'トリックテイキング':3}, desc:'カードの ながれを よむ（トリックテイキング）'},
  {id:'mage',     name:'まほうつかい', tags:{'ワーカープレイスメント':3,'頭脳戦':1,'重量級':1}, desc:'じっくり かんがえて かつ（頭脳戦・重量級）'},
  {id:'dancer',   name:'おどりこ',     tags:{'パーティー':2,'盛り上がる':1}, desc:'その場を もりあげる（パーティー）'},
  {id:'jester',   name:'あそびにん',   tags:{'運要素':1}, desc:'うんと ハプニングを たのしむ（運要素）'},
  {id:'warrior',  name:'せんし',       tags:{'対戦':1}, desc:'まっこうから ぶつかる（対戦）'},
  {id:'traveler', name:'たびびと',     tags:{'家族向け':1,'軽量級':1}, desc:'だれとでも きがるに あそぶ（家族向け・軽量級）'}
];
const HERO_JOB = {id:'hero', name:'ゆうしゃ', desc:'なんでも こなす（いろいろな ゲームが すき）'};
function jobById(id){ return id === 'hero' ? HERO_JOB : (JOBS.find(j => j.id === id) || null); }
/* その人の ジョブ（じぶんで えらんで いれば それ、なければ いちおしから） */
function jobFor(pf){
  if(!pf) return null;
  if(pf.job){ const j = jobById(pf.job); if(j) return Object.assign({manual:true}, j); }
  const j = jobOf(pf.favs);
  return j ? Object.assign({manual:false}, j) : null;
}
function jobScores(g){
  const pts = {};
  (g.tags || []).forEach(t => JOBS.forEach(j => { if(j.tags[t]) pts[j.id] = (pts[j.id] || 0) + j.tags[t]; }));
  return pts;
}
/* その ゲームの ジョブ（おなじ てんなら JOBS の じゅん） */
function gameJob(g){
  const pts = jobScores(g);
  let best = null;
  JOBS.forEach(j => { if(pts[j.id] && (!best || pts[j.id] > pts[best.id])) best = j; });
  return best;
}
function jobOf(favIds){
  const games = (favIds || []).map(id => state.games.find(g => g.id === id)).filter(Boolean);
  if(!games.length) return null;
  const votes = {}, total = {};
  games.forEach(g => {
    const j = gameJob(g);
    if(j) votes[j.id] = (votes[j.id] || 0) + 1;
    const p = jobScores(g);
    Object.keys(p).forEach(k => { total[k] = (total[k] || 0) + p[k]; });
  });
  const ids = Object.keys(votes);
  if(!ids.length) return HERO_JOB;
  const max = Math.max(...ids.map(k => votes[k]));
  const tops = ids.filter(k => votes[k] === max);
  if(tops.length >= 3) return HERO_JOB;                           /* みんな ちがう → なんでも こなす */
  tops.sort((x, y) => (total[y] || 0) - (total[x] || 0) ||
                      JOBS.findIndex(j => j.id === x) - JOBS.findIndex(j => j.id === y));
  return JOBS.find(j => j.id === tops[0]);
}

/* ---------------- しょうごうの きろく ---------------- */
function titleKey(statId, tier){ return statId + ':' + tier; }
function titleByKey(k){
  const m = /^([a-z]+):([0-3])$/.exec(String(k || ''));
  if(!m) return '';
  const st = ADV_STATS.find(x => x.id === m[1]);
  return st ? st.titles[Number(m[2])] : '';
}
function titleHowText(k){
  const m = /^([a-z]+):([0-3])$/.exec(String(k || ''));
  if(!m) return '';
  const st = ADV_STATS.find(x => x.id === m[1]);
  const t = TITLE_TIERS[Number(m[2])];
  if(!st || !t) return '';
  return st.name + 'が いちばん たかい まま、Lv.' + t.from + ' いじょうに なる';
}
/* その人の プロフィール（じぶん／なかま だけ。ゲストは なし） */
function profileFor(name){
  const a = account();
  if(a && a.name === name) return state.profile;
  const f = friendList().find(x => x.name === name);
  return f ? {title:f.title || '', titles:f.titles || [], favs:f.favs || [], bio:f.bio || '', job:f.job || ''} : null;
}
/* ひとに みせる しょうごう（えらんで いれば それ、なければ じどう） */
function shownTitle(name, a){
  const pf = profileFor(name);
  if(pf && pf.title && pf.titles.some(x => x.k === pf.title)) return titleByKey(pf.title);
  return advTitle(a);
}
function saveProfileLocal(){ store.write(KEY.profile, state.profile); }
async function refreshProfile(){
  if(!isOnline()) return false;
  const d = await api('/api/me');
  const next = {title:d.title || '', titles:d.titles || [], favs:d.favs || [], bio:d.bio || '', job:d.job || ''};
  const changed = JSON.stringify(next) !== JSON.stringify(state.profile);
  state.profile = next; saveProfileLocal();
  return changed;
}
async function saveProfile(patch){
  const d = await api('/api/profile', {method:'POST', body:patch});
  state.profile = {title:d.title || '', titles:d.titles || [], favs:d.favs || [], bio:d.bio || '', job:d.job || ''};
  saveProfileLocal();
}
/* いまの しょうごうを「てにいれた」ことに する（おなじ けいとうの 下の だんかいも） */
async function recordEarnedTitles(){
  const me = account();
  if(!me || !isOnline()) return false;
  const a = adventurer(me.name);
  if(!a.plays) return false;
  const top = advTopStat(a), tier = titleTier(advLevel(a.plays));
  const have = state.profile.titles.map(x => x.k);
  const add = [];
  for(let t = 0; t <= tier; t++){
    const k = titleKey(top.id, t);
    if(have.indexOf(k) < 0) add.push({k, at: todayStr()});
  }
  if(!add.length) return false;
  await saveProfile({earned: add});
  return true;
}

function advTopStat(a){
  return ADV_STATS.slice().sort((x,y) => a.stats[y.id] - a.stats[x.id])[0];

function advTitle(a){
  if(!a.plays) return 'たびだちまえの わかもの';
  return advTopStat(a).titles[titleTier(advLevel(a.plays))];
}

   ========================================================= */
function saveChoubo(){ store.write(KEY.choubo, state.choubo); }
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
function chouboCalc(){
  const c = state.choubo;
  const members = c.members.slice();
  c.items.forEach(it => { if(it.payer && members.indexOf(it.payer) < 0) members.push(it.payer); });
  const total = c.items.reduce((s,it) => s + (Number(it.amount)||0), 0);
  if(!members.length) return {members, total, share:0, transfers:[], bal:{}};
  const base = Math.floor(total / members.length);
  let rest = total - base * members.length;          /* はすう（1円たんい） */
  const owe = {}, paid = {};
  members.forEach(m => { owe[m] = base; paid[m] = 0; });
  c.items.forEach(it => { if(it.payer) paid[it.payer] = (paid[it.payer]||0) + (Number(it.amount)||0); });
  /* はすうは たてかえた 人から じゅんに もつ（やりとりが ふえない ように） */
  members.slice().sort((a,b) => paid[b] - paid[a]).forEach(m => { if(rest > 0){ owe[m]++; rest--; } });
  const bal = {};
  members.forEach(m => { bal[m] = paid[m] - owe[m]; });
  const cred = members.filter(m => bal[m] > 0).map(m => ({m, v:bal[m]})).sort((a,b) => b.v - a.v);
  const debt = members.filter(m => bal[m] < 0).map(m => ({m, v:-bal[m]})).sort((a,b) => b.v - a.v);
  const transfers = [];
  let i = 0, j = 0;
  while(i < debt.length && j < cred.length){
    const x = Math.min(debt[i].v, cred[j].v);
    if(x > 0) transfers.push({from:debt[i].m, to:cred[j].m, v:x});
    debt[i].v -= x; cred[j].v -= x;
    if(debt[i].v <= 0) i++;
    if(cred[j].v <= 0) j++;
  }
  return {members, total, share: total / members.length, transfers, bal, paid, owe};
}

function talkPool(){
  const cat = state.talk.cat;
  const out = [];
  TALK_CATS.forEach(c => { if(cat === 'all' || cat === c.id) TALK_TOPICS[c.id].forEach(q => out.push({cat:c.name, q})); });
  if(cat === 'all' || cat === 'mine') state.talk.custom.forEach(q => out.push({cat:'じぶんで ついか', q}));
  return out;
}
function talkNext(){
  const pool = talkPool();
  if(!pool.length){ state.talk.cur = null; return; }
  if(!state.talk.order.length || state.talk.orderCat !== state.talk.cat){
    state.talk.order = shuffled(pool.map((_,i) => i));
    state.talk.orderCat = state.talk.cat;

  const i = state.talk.order.shift();
  state.talk.cur = pool[i] || pool[0];

    updateLendList();
  });
}

/* ---------------- なかまの なまえ ----------------
   よく あそぶ 人を とうろく して おくと、
   きろくや くじ引きで えらぶ だけで よく なる。 */
function savePlayers(){ store.write(KEY.players, state.players); }
/* どうぐで えらべる なまえ：じぶん → とうろく した なまえ → なかま（ともだち） */
function rosterNames(){
  const out = [];
  const add = n => { n = String(n || '').trim(); if(n && out.indexOf(n) < 0) out.push(n); };
  const a = (typeof account === 'function') ? account() : null;
  if(a) add(a.name);
  state.players.forEach(p => add(p.name));
  if(typeof friendList === 'function') friendList().forEach(f => add(f.name));
  return out;
}

function addPlayer(name){
  const n = String(name || '').trim();
  if(!n) return false;
  if(state.players.some(p => p.name === n)) return false;
  state.players.push({name:n});
  savePlayers();
  return true;
}
function removePlayer(name){
  state.players = state.players.filter(p => p.name !== name);
  savePlayers();
}
/* なまえを かえたら、これまでの きろくも まとめて なおす */
function renamePlayer(oldName, newName){
  const from = String(oldName||'').trim(), to = String(newName||'').trim();
  if(!from || !to || from === to) return 0;
  let count = 0;
  state.games.forEach(g => {
    playsOf(g).forEach(pl => {
      let hit = false;
      if(pl.w === from){ pl.w = to; hit = true; }
      if(Array.isArray(pl.u) && pl.u.indexOf(from) >= 0){
        pl.u = pl.u.map(n => n === from ? to : n).filter((n,i,a) => a.indexOf(n) === i);
        hit = true;
      }
      if(hit) count++;
    });
  });
  const i = state.players.findIndex(p => p.name === from);
  if(i >= 0) state.players[i].name = to;
  savePlayers();
  if(count) saveGames();
  return count;
}
/* その人が かった かいすう */
function winCount(name){
  return cardPlays().filter(r => r.pl.w === name).length;
}
/* その きろくに でて くる 人（いっしょに あそんだ 人＋かった人） */
function playMembers(pl){
  const list = Array.isArray(pl.u) ? pl.u.slice() : [];
  const w = (pl.w || '').trim();
  if(w && list.indexOf(w) < 0) list.push(w);
  return list;
}
/* おなじ きろくか どうかの めじるし（日にち・ゲーム・かった人・メンバー） */
function playKey(gid, pl){
  return String(gid) + '|' + (pl.d || '') + '|' + (pl.w || '') + '|' + playMembers(pl).slice().sort().join(',');
}
/* さかばから とどいた きろくを、この アプリの かたちに なおす */
function netToPlay(r){
  return {d:r.d || '', n:r.n || undefined, w:r.w || undefined, u:Array.isArray(r.u) ? r.u.slice() : []};
}
function netGame(r){
  return state.games.find(x => x.id === r.g) ||
    {id:r.g, title:r.t || '？', tags:Array.isArray(r.k) ? r.k : [], playTime:Number(r.p) || 0, difficulty:Number(r.f) || 0};
}

/* けした きろくの しるし。
   けした きろくの コピーが さかばや サイトに のこって いても、
   もう かぞえない ように する。 */
function saveGone(){ store.write(KEY.gone, state.gone); }
function isGone(key){ return state.gone.indexOf(key) >= 0; }
function addGone(key){
  if(!key || isGone(key)) return;
  state.gone.push(key);
  if(state.gone.length > 600) state.gone = state.gone.slice(-600);
  saveGone();
}
/* きろくを けす とき（ばしょを とわず）に よぶ */
function forgetPlay(gid, pl){
  addGone(playKey(gid, pl));
  if(pl && pl.sid){
    if(!Array.isArray(state.net.del)) state.net.del = [];
    if(state.net.del.indexOf(pl.sid) < 0) state.net.del.push(pl.sid);
    state.net.plays = (state.net.plays || []).filter(r => r.id !== pl.sid);
    saveNet();
  }
}

/* ぼうけんしゃカードの もとに なる きろく（この スマホ＋みんなの きろく） */
function cardPlays(){
  const out = [], seen = {};
  state.games.forEach(g => playsOf(g).forEach(pl => {
    seen[playKey(g.id, pl)] = 1;
    out.push({g:g, pl:pl, mine:true});
  }));
  const add = r => {
    const pl = netToPlay(r);
    const key = playKey(r.g, pl);
    if(seen[key] || isGone(key)) return;     /* おなじ きろく・けした きろくは かぞえない */
    seen[key] = 1;
    out.push({g:netGame(r), pl:pl, mine:false, owner:r.owner});
  };
  (Array.isArray(state.net.plays) ? state.net.plays : []).forEach(add);
  return out;
}
/* なかまから とどいて いる きろくの かず */
function fromFriendsCount(){
  const me = account();
  return cardPlays().filter(r => !r.mine && !(me && r.owner === me.id)).length;
}
/* きろくに でて くる ぼうけんしゃ ぜんいん */
function allAdventurers(){
  const m = {};
  cardPlays().forEach(r => playMembers(r.pl).forEach(n => { m[n] = (m[n] || 0) + 1; }));
  rosterNames().forEach(n => { if(!(n in m)) m[n] = 0; });
  return Object.keys(m).map(n => ({name:n, plays:m[n]}))
    .sort((a,b) => b.plays - a.plays || a.name.localeCompare(b.name,'ja'));
}

function splitNames(text){
  return String(text || '').split(/[\s、,，・]+/).map(x => x.trim()).filter(Boolean);
}

/* ほぞん する ときの メンバー（えらんだ 人＋ほかの 人＋かった人） */
function collectMembers(winner){

  return list;

/* 「たろう はなこ、じろう」→ ['たろう','はなこ','じろう']
   すうじ だけの ときは 「1ばんめの 人」…に する */
function parseNames(text){
  const t = String(text || '').trim();
  if(!t) return [];
  if(/^\d+$/.test(t)){
    const n = Math.min(20, Math.max(1, Number(t)));
    const out = [];
    for(let i = 1; i <= n; i++) out.push(i + 'ばんめの 人');
    return out;
  }
  return t.split(/[、,\s]+/).map(x => x.trim()).filter(Boolean).slice(0, 20);
}
function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* サイコロの め（ドット絵ふうに 9マスで あらわす） */
function pipsHTML(n){

    2:[1,0,0, 0,0,0, 0,0,1],
    3:[1,0,0, 0,1,0, 0,0,1],
    4:[1,0,1, 0,0,0, 1,0,1],
    5:[1,0,1, 0,1,0, 1,0,1],
    6:[1,0,1, 1,0,1, 1,0,1]
  };
  const cells = (map[n] || map[1]).map(v => '<span'+(v?' class="on"':'')+'></span>').join('');
  return '<div class="die-face">'+cells+'</div>';
}

  const best = Math.max.apply(null, totals);

  return '<div class="score-layout">' +

      '</tr>' +
    '</tbody></table></div>' +

    '<div class="score-controls">' +
    /* えらんだ マスを ボタンで ふやしたり へらしたり する（キーボードを つかわない） */

function bindScore(){
  const box = document.getElementById('scoreBox');
  if(!box) return;

  /* さいしょの「はじめる」ボタン。
     けした あと ここを つなぎ直さないと、もう一度 はじめられなく なる。 */
  const start = document.getElementById('scoreStart');
  if(start) start.onclick = () => {
    const raw = (document.getElementById('scoreNames')||{value:''}).value;
    const names = parseNames(raw);
    if(!names.length) return toast('なまえを いれて ください');
    saveNames(raw);
    state.score = {names: names, rows: [names.map(() => '')]};
    saveScore();
    box.innerHTML = scoreHTML(); bindScore();
  };

  /* マスを タップして えらぶ */
  box.querySelectorAll('.score-cell').forEach(td => {
    td.onclick = () => {
      state.scoreSel = {r: Number(td.dataset.r), c: Number(td.dataset.c)};
      box.innerHTML = scoreHTML(); bindScore();
    };
  });

  /* ボタンで ふやす・へらす（キーボードを ひらかない） */
  const applyScore = (fn) => {
    const sel = state.scoreSel || {r:0, c:0};
    const rows = state.score.rows;
    if(!rows[sel.r]) rows[sel.r] = state.score.names.map(() => '');
    const now = Number(rows[sel.r][sel.c]) || 0;
    rows[sel.r][sel.c] = String(fn(now));
    saveScore();
    box.innerHTML = scoreHTML(); bindScore();
    playClick();
  };
  box.querySelectorAll('[data-scoreadd]').forEach(b => b.onclick = () => {
    const v = Number(b.dataset.scoreadd) || 0;
    applyScore(now => now + v);
  });
  box.querySelectorAll('[data-scoreset]').forEach(b => b.onclick = () => {
    const v = Number(b.dataset.scoreset) || 0;
    applyScore(() => v);
  });

  /* どうしても すうじで いれたい ときだけ キーボードを だす */
  const keypad = document.getElementById('scoreKeypad');
  if(keypad) keypad.onclick = () => {
    const sel = state.scoreSel || {r:0, c:0};
    const rows = state.score.rows;
    if(!rows[sel.r]) rows[sel.r] = state.score.names.map(() => '');
    const now = rows[sel.r][sel.c] === undefined || rows[sel.r][sel.c] === '' ? '0' : rows[sel.r][sel.c];
    askNumber((state.score.names[sel.c] || '') + '　'+(sel.r+1)+'かいめ の てんすう', now, v => {
      rows[sel.r][sel.c] = String(v);
      saveScore();
      box.innerHTML = scoreHTML(); bindScore();
    });
  };

  const add = document.getElementById('scoreAddRow');
  if(add) add.onclick = () => {
    state.score.rows.push(state.score.names.map(() => ''));
    saveScore();
    box.innerHTML = scoreHTML(); bindScore();
  };
  const clear = document.getElementById('scoreClear');
  if(clear) clear.onclick = () => {
    ask('てんすう表を さいしょから やりなおしますか？', () => {
      state.score = {names:[], rows:[]};
      saveScore();
      box.innerHTML = scoreHTML(); bindScore();
    });
  };
}

  box.querySelectorAll('[data-cnt]').forEach(b => b.onclick = () => {

    if(!state.counters[i]) return;
    state.counters[i].value += step;
    saveCounters();
    const v = document.getElementById('cntv' + i);
    if(v) v.textContent = state.counters[i].value;
  });
  const zero = document.getElementById('counterZero');
  if(zero) zero.onclick = () => {
    state.counters.forEach(c => { c.value = 0; });
    saveCounters();
    box.innerHTML = counterHTML(); bindCounters();
  };
  const clear = document.getElementById('counterClear');
  if(clear) clear.onclick = () => {
    ask('カウンターを やめますか？', () => {
      state.counters = [];
      saveCounters();
      box.innerHTML = counterHTML(); bindCounters();
    });
  };
}

/* この端末に ある あそんだ きろくを ぜんぶ あつめて、あたらしい順に ならべる。
   きろくは サイトに あげて いないので、この スマホでだけ 見られる。 */
function allPlays(){
  const out = [];
  state.games.forEach(g => {
    playsOf(g).forEach((pl, i) => out.push({g:g, pl:pl, i:i}));
  });
  out.sort((a,b) => String(b.pl.d||'').localeCompare(String(a.pl.d||'')));
  return out;
}
/* なにも かいて いない きろくか どうか */
function isEmptyPlay(pl){
  return !pl.n && !pl.w && !(pl.m && String(pl.m).trim()) && !(Array.isArray(pl.u) && pl.u.length);
}
function dateFullLabel(str){
  if(!str) return '日づけ なし';
  const p = String(str).split('-');
  if(p.length !== 3) return str;
  const w = ['日','月','火','水','木','金','土'];
  const d = new Date(str + 'T00:00:00');
  const wd = isNaN(d.getTime()) ? '' : '（' + w[d.getDay()] + '）';
  return Number(p[0]) + '年' + Number(p[1]) + '月' + Number(p[2]) + '日' + wd;
}

/* ---------------- カレンダー ----------------
   あそんだ 日を 月ごとに ならべて みせる。 */
function ymOf(str){ return String(str||'').slice(0,7); }
function shiftMonth(ym, d){
  const p = ym.split('-');
  let y = Number(p[0]), m = Number(p[1]) + d;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  return y + '-' + String(m).padStart(2,'0');
}
function calendarHTML(){
  const ym = state.calYm || todayStr().slice(0,7);
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const days = new Date(y, m, 0).getDate();
  const head = first.getDay();

  /* その月に あそんだ ゲームを 日ごとに あつめる */
  const byDay = {};
  allPlays().forEach(r => {
    if(ymOf(r.pl.d) !== ym) return;
    const d = Number(String(r.pl.d).slice(8,10));
    (byDay[d] = byDay[d] || []).push(r);
  });
  const total = Object.keys(byDay).reduce((a,k) => a + byDay[k].length, 0);

  let cells = '';
  for(let i = 0; i < head; i++) cells += '<div class="cal-cell empty"></div>';
  for(let d = 1; d <= days; d++){
    const list = byDay[d] || [];
    const isToday = (ym + '-' + String(d).padStart(2,'0')) === todayStr();
    cells += '<button class="cal-cell'+(list.length ? ' has' : '')+(isToday ? ' today' : '')+'"' +
      (list.length ? ' data-calday="'+ym+'-'+String(d).padStart(2,'0')+'"' : ' disabled') + '>' +
      '<span class="cal-d">'+d+'</span>' +
      (list.length ? '<span class="cal-dot">'+(list.length > 3 ? '●'.repeat(3)+'+' : '●'.repeat(list.length))+'</span>' : '') +
      '</button>';
  }

  const sel = state.calDay;
  const selList = sel ? allPlays().filter(r => r.pl.d === sel) : [];

  return '<div class="row" style="align-items:center;margin-bottom:8px">' +
      '<button class="mini" data-calmove="-1" style="flex:0 0 auto">◀</button>' +
      '<p class="count" style="flex:1;text-align:center;margin:0">'+y+'年 '+m+'月／'+total+'かい</p>' +
      '<button class="mini" data-calmove="1" style="flex:0 0 auto">▶</button></div>' +
    '<div class="cal-grid">' +
      ['日','月','火','水','木','金','土'].map(w => '<div class="cal-w">'+w+'</div>').join('') +
      cells +
    '</div>' +
    (sel && selList.length ?
      '<div class="win" style="margin-top:10px">' +
        '<p class="count" style="margin:0 0 8px">'+esc(dateFullLabel(sel))+'</p>' +
        selList.map(r => '<p style="margin:0 0 6px">' +
          '<button class="mini" data-open="'+esc(r.g.id)+'">'+esc(r.g.title)+' ▶</button>' +
          (r.pl.n ? ' <span class="count">'+esc(r.pl.n)+'人</span>' : '') +
          (r.pl.w ? ' <span class="count">かち：'+esc(r.pl.w)+'</span>' : '') +
          (r.pl.m ? '<br><span style="font-size:13px;white-space:pre-wrap">'+esc(r.pl.m)+'</span>' : '') +
        '</p>').join('') +
      '</div>' : '') +
    (total === 0 ? '<p class="count" style="margin:10px 0 0">この月の きろくは ありません。</p>' : '');
}

   きろくを 1けんずつ ランダムに みせる。 */
/* ---------------- みんなの 思い出 ----------------
   じぶんの きろく（かんそう・しゃしん）と、なかまが「みせる」に した
   きろくの しゃしんを ひとつに まとめる。 */
function ownerName(id){
  const a = account();
  if(a && a.id === id) return a.name;
  const f = friendList().find(x => x.id === id);
  return f ? f.name : 'なかま';
}
function memoryPool(){
  const out = [];
  const mySids = {};
  allPlays().forEach(r => {
    if(r.pl.sid) mySids[r.pl.sid] = 1;
    if(r.pl.m || (r.pl.p && r.pl.p.length)){
      out.push({kind:'mine', key:'m|'+r.g.id+'|'+r.i, g:r.g, pl:r.pl, i:r.i,
                who: account() ? account().name : '', pics: r.pl.p || []});
    }
  });
  (state.net.plays || []).forEach(r => {
    if(mySids[r.id]) return;                         /* じぶんの きろくは もう ある */
    const pics = Array.isArray(r.pic) ? r.pic : [];
    if(!pics.length) return;
    const pl = netToPlay(r);
    if(isGone(playKey(r.g, pl))) return;
    out.push({kind:'net', key:'n|'+r.id, id:r.id, g:netGame(r), pl:pl,
              who: ownerName(r.owner), pics: pics});
  });
  return out.sort((a,b) => String(b.pl.d||'').localeCompare(String(a.pl.d||'')));
}
function memPhotosHTML(m, big){
  if(!m.pics.length) return '';
  return '<div class="play-photos'+(big ? ' big' : '')+'">' + m.pics.map((src, k) =>
    '<img src="'+esc(src)+'" alt="" loading="lazy" data-memzoom="'+esc(m.key)+'|'+k+'">').join('') + '</div>';
}
function memCardHTML(m, big){

  return '<div class="win" style="'+(big ? 'text-align:center' : 'margin-bottom:12px')+'">' +

      '<p class="encounter" style="margin:0 0 6px">'+esc(m.g.title)+'</p>' +

function memoryHTML(){
  const list = memoryPool();
  if(!list.length){
    return '<p class="count" style="margin:0">かんそうか しゃしんの ある きろくが たまると、ここで ふりかえれます。<br>' +
      'なかまが しゃしんを「みせる」に した きろくも ここに ながれて きます。</p>';
  }
  const cur = state.memory && list.find(x => x.key === state.memory.key);
  const pick = cur || list[Math.floor(Math.random() * list.length)];
  if(!cur) state.memory = {key: pick.key};
  return memCardHTML(pick, true) +
    '<div class="btn-row" style="margin-top:10px">' +
      '<button class="btn small" style="flex:1" id="memoryNext">べつの 思い出</button>' +

/* ---------------- あみだくじ ----------------
   たての 線の あいだに、よこ線を ひける ばしょを ならべる。
   ひとつ タップすると よこ線が つき、もう一度 タップで けせる。
   rows[y][x] = true なら、x番めと x+1番めの たて線の あいだに よこ線が ある。 */
const AMIDA_ROWS = 12;      /* よこ線を ひける だんの かず */

function amidaInit(names, goals){
  const n = names.length;
  return {
    names: names,
    goals: goals,
    rows: Array.from({length: AMIDA_ROWS}, () => new Array(Math.max(0, n-1)).fill(false)),
    result: null,
    phase: 'edit',     /* edit＝線を ひく／reveal＝けっかを ひらく */
    opened: []         /* すでに ひらいた 人（うえの ばんごう） */
  };
}
function amidaOpened(a, i){ return (a.opened || []).indexOf(i) >= 0; }
/* した の ふだを みせて いいか（その ばしょへ ついた 人が ひらかれて いるか） */
function amidaGoalShown(a, endIndex){
  return (a.opened || []).some(i => amidaTrace(a, i).end === endIndex);
}
/* よこ線を ランダムに ちらす */
function amidaShuffleLines(a){
  const cols = a.names.length - 1;
  a.rows = a.rows.map(() => new Array(cols).fill(false));
  const target = Math.max(cols * 2, Math.round(cols * AMIDA_ROWS * 0.3));
  let placed = 0, guard = 0;
  while(placed < target && guard++ < 400){
    const y = Math.floor(Math.random() * AMIDA_ROWS);
    const x = Math.floor(Math.random() * cols);
    if(a.rows[y][x]) continue;
    if(x > 0 && a.rows[y][x-1]) continue;          /* となりと くっつけない */
    if(x < cols-1 && a.rows[y][x+1]) continue;
    a.rows[y][x] = true;
    placed++;
  }
  a.result = null;
}
/* 1人ぶんの みちすじを たどる。とおった ばしょも かえす */
function amidaTrace(a, start){
  let x = start;
  /* たての 線を おりて いき、よこ線が あれば
     その たかさ（y+0.5）まで おりてから よこへ うつる。
     こうすると あみだの 線の 上を ぴったり なぞる。 */
  const path = [{y:0, x:x}];
  for(let y = 0; y < AMIDA_ROWS; y++){
    let nx = x;
    if(x > 0 && a.rows[y][x-1]) nx = x - 1;
    else if(x < a.names.length-1 && a.rows[y][x]) nx = x + 1;
    if(nx !== x){
      path.push({y:y+0.5, x:x});    /* よこ線の たかさまで おりる */
      path.push({y:y+0.5, x:nx});   /* よこ線を わたる */
      x = nx;
    }
  }
  path.push({y:AMIDA_ROWS, x:x});   /* いちばん したまで おりる */
  return {end:x, path:path};
}
function amidaRunAll(a){
  return a.names.map((nm, i) => {
    const t = amidaTrace(a, i);
    return {name:nm, from:i, to:t.end, goal:a.goals[t.end] || ''};
  });
}

/* ばんの ずめん（SVG）。よこ線を ひける ばしょは タップできる まる。 */
function amidaBoardHTML(a){
  const n = a.names.length;
  const colW = 56, rowH = 22, padX = 30, padTop = 34, padBottom = 34;
  const w = padX*2 + colW*(n-1);
  const h = padTop + rowH*AMIDA_ROWS + padBottom;
  const cx = i => padX + colW*i;
  const cy = y => padTop + rowH*y;

  let svg = '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" shape-rendering="crispEdges" class="amida-svg">' +
    '<defs><linearGradient id="amidaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent-2)"/>' +
      '<stop offset="55%" stop-color="var(--accent-2)"/>' +
      '<stop offset="100%" stop-color="var(--accent)"/>' +
    '</linearGradient></defs>';

  /* たての 線 */
  for(let i = 0; i < n; i++){
    svg += '<line x1="'+cx(i)+'" y1="'+cy(0)+'" x2="'+cx(i)+'" y2="'+cy(AMIDA_ROWS)+'" ' +
           'stroke="currentColor" stroke-width="4"/>';
  }
  /* ひかれて いる よこ線 */
  for(let y = 0; y < AMIDA_ROWS; y++){
    for(let x = 0; x < n-1; x++){
      if(a.rows[y][x]){
        svg += '<line x1="'+cx(x)+'" y1="'+cy(y+0.5)+'" x2="'+cx(x+1)+'" y2="'+cy(y+0.5)+'" ' +
               'stroke="currentColor" stroke-width="4"/>';
      }
    }
  }
  /* ぜんいんの みちすじを いちどに はしらせる ばあい */
  if(a.allPaths){
    const colors = ['var(--accent)','var(--accent-2)','#7ED957','#FF8FA3','#B08CFF','#FFD166','#5BD1D7','#F4845F','#9BC53D','#E36414'];
    a.allPaths.forEach((pp, k) => {
      const ps = pp.map(pt => ({x: cx(pt.x), y: cy(pt.y)}));
      let ln = 0;
      for(let i = 1; i < ps.length; i++) ln += Math.abs(ps[i].x - ps[i-1].x) + Math.abs(ps[i].y - ps[i-1].y);
      svg += '<polyline class="amida-path" points="'+ps.map(q => q.x+','+q.y).join(' ')+'" ' +
        'fill="none" stroke="'+colors[k % colors.length]+'" stroke-width="5" stroke-linecap="square" ' +
        'stroke-dasharray="'+ln+'" stroke-dashoffset="'+ln+'" style="--amida-time:2.2s"/>';
    });
  }

  /* けっかの みちすじ。
     線の ながさを はかって おき、CSSで うえから したへ のばす
     （点線の きれめを ずらす やりかた。かるくて なめらか）。 */
  if(a.result && a.result.path){
    /* みちすじの てんを 「よこ,たて」の かたちで もつ */
    const pts = a.result.path.map(pt => ({x: cx(pt.x), y: cy(pt.y)}));
    let len = 0;
    for(let i = 1; i < pts.length; i++){
      len += Math.abs(pts[i].x - pts[i-1].x) + Math.abs(pts[i].y - pts[i-1].y);
    }
    const dur = Math.max(1.0, Math.min(2.8, len/240)).toFixed(2);
    const points = pts.map(p => p.x + ',' + p.y).join(' ');
    const d = 'M ' + pts.map(p => p.x + ' ' + p.y).join(' L ');

    svg += '<polyline class="amida-path" points="'+points+'" ' +
      'fill="none" stroke="url(#amidaGrad)" stroke-width="6" stroke-linecap="square" ' +
      'stroke-dasharray="'+len+'" stroke-dashoffset="'+len+'" ' +
      'style="--amida-time:'+dur+'s"/>';
    /* 線の さきを はしる ひかり */
    svg += '<circle class="amida-head" r="7" fill="var(--accent)">' +
      '<animateMotion dur="'+dur+'s" fill="freeze" calcMode="linear" path="'+d+'"/></circle>';
  }
  svg += '</svg>';

  /* タップできる ばしょ（SVGの 上に かさねる）。
     けっかを ひらく だんかいでは 線を さわれない ように する。 */
  let dots = '';
  if(a.phase === 'edit'){
    for(let y = 0; y < AMIDA_ROWS; y++){
      for(let x = 0; x < n-1; x++){
        dots += '<button class="amida-dot'+(a.rows[y][x] ? ' on' : '')+'" data-amida="'+y+'|'+x+'" ' +
          'style="left:'+(cx(x)+colW/2)+'px;top:'+cy(y+0.5)+'px" aria-label="'+(y+1)+'だんめ"></button>';
      }
    }
  }

  /* うえ（なまえ）と した（けっか）の ふだ */
  let heads = '', foots = '';
  for(let i = 0; i < n; i++){
    const open = amidaOpened(a, i);
    heads += '<button class="amida-label head'+(open ? ' opened' : '')+'"' +
      (a.phase === 'reveal' ? ' data-amidapath="'+i+'"' : ' disabled') +
      ' style="left:'+cx(i)+'px;top:6px">'+esc(a.names[i])+'</button>';
    /* した の ふだは、その ばしょに ついた 人が ひらかれる まで ？ の まま */
    const shown = amidaGoalShown(a, i);
    const justOpened = shown && a.result && a.result.one &&
      amidaTrace(a, a.names.indexOf(a.result.one.name)).end === i;
    foots += '<span class="amida-label goal'+(shown ? '' : ' hidden-goal')+(justOpened ? ' flash' : '')+'" ' +
      'style="left:'+cx(i)+'px;top:'+(cy(AMIDA_ROWS)+10)+'px">' +
      (shown ? esc(a.goals[i]||'') : '？') + '</span>';
  }

  return '<div class="amida-wrap"><div class="amida-board" style="width:'+w+'px;height:'+h+'px">' +
    svg + dots + heads + foots + '</div></div>';
}

/* =========================================================
   なかまの なまえ（人の いちらん）
   ・じぶん  … この スマホの もちぬし（1人）
   ・なかま  … じぶんの スマホを もって いて、きろくが とどく人
   ・ゲスト  … なまえだけの人。きろくにも カードにも つかえる
   ========================================================= */
function friendList(){ return (state.friends && state.friends.friends) || []; }
function personKind(name){
  const a = account();
  if(a && a.name === name) return 'me';
  if(friendList().some(f => f.name === name)) return 'friend';
  return 'guest';
}
function allPeople(){
  const m = {};
  const touch = n => { if(n && !(n in m)) m[n] = 0; };
  state.players.forEach(p => touch(p.name));
  friendList().forEach(f => touch(f.name));
  const a = account(); if(a) touch(a.name);
  cardPlays().forEach(r => playMembers(r.pl).forEach(n => { touch(n); m[n]++; }));
  const rank = k => (k === 'me' ? 0 : k === 'friend' ? 1 : 2);
  return Object.keys(m).map(n => ({
    name: n, plays: m[n], kind: personKind(n),
    listed: state.players.some(p => p.name === n)
  })).sort((x, y) => rank(x.kind) - rank(y.kind) || y.plays - x.plays || x.name.localeCompare(y.name, 'ja'));
}
function personRowHTML(p){
  const badge = p.kind === 'me' ? '<span class="badge">じぶん</span>'
    : p.kind === 'friend' ? '<span class="badge" style="border-color:var(--accent-2);color:var(--accent-2)">なかま</span>'
    : '<span class="badge" style="border-color:var(--muted);color:var(--muted)">ゲスト</span>';
  let btns = '';
  if(p.kind === 'friend') btns = '<button class="mini warn" data-frbyname="'+esc(p.name)+'">はずす</button>';
  else if(p.kind === 'guest'){
    btns = (isOnline() ? '<button class="mini" data-frlink="'+esc(p.name)+'">つなぐ</button>' : '') +
      (p.listed ? '<button class="mini" data-renameplayer="'+esc(p.name)+'">なおす</button>' +
                  '<button class="mini warn" data-delplayer="'+esc(p.name)+'">けす</button>'
                : '<button class="mini" data-addknown="'+esc(p.name)+'">＋</button>');
  }else{
    btns = '<button class="mini" data-renameplayer="'+esc(p.name)+'">なおす</button>';
  }
  return '<div class="admin-row">' +
    '<button class="t" data-go2="#/card/'+encodeURIComponent(p.name)+'" style="all:unset;flex:1;min-width:0;cursor:pointer">' +
      '<b style="display:block;font-size:14px;font-weight:400">'+esc(p.name)+' '+badge+

      '<span style="font-size:11px;color:var(--muted)">'+(p.plays ? p.plays+'かいの きろく' : 'きろくは まだ')+
        (wantsOf(p.name).length ? '・遊んでみたい '+wantsOf(p.name).length : '')+'</span></button>' +
    btns + '</div>';
}

   「ぼうけんしゃの証」＝ サーバーが くれる ぼうけんしゃIDと あいことば。
   この スマホに しまって おき、ともだちや ほかの スマホと つながる ときに つかう。

/* さかばの サーバーの アドレス。
   ここに かいて おくと、ともだちは なにも いれずに とうろく できる。
   サーバーを ひっこし した ときは この1行を かきかえる。 */
const API_BASE_DEFAULT = 'https://bgl-api.qiubenrixiang.workers.dev';
/* アプリの バージョン（Safari と ホーム画面の アプリで おなじか くらべる ため） */
const APP_VERSION = '2026.09.24-b';
function apiBase(){
  const saved = String(store.read(KEY.api, '') || '').trim().replace(/\/+$/, '');
  return saved || API_BASE_DEFAULT;
}
function saveApiBase(v){ store.write(KEY.api, String(v || '').trim().replace(/\/+$/, '')); }
function account(){ return store.read(KEY.acct, null); }
function saveAccount(a){ store.write(KEY.acct, a || null); }
function isOnline(){ const a = account(); return !!(a && a.token && apiBase()); }

async function api(path, opts){
  const base = apiBase();
  if(!base) throw new Error('さかばの アドレスを いれて ください');
  const o = opts || {};
  const headers = {};
  if(o.body) headers['Content-Type'] = 'application/json';
  const a = account();
  if(a && a.token && o.auth !== false) headers['Authorization'] = 'Bearer ' + a.token;
  let res;
  try{
    res = await fetch(base + path, {
      method: o.method || 'GET',
      headers: headers,
      body: o.body ? JSON.stringify(o.body) : undefined
    });
  }catch(e){
    throw new Error('さかばに つながりません。アドレスと でんぱを たしかめて ください');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || !data || data.ok === false){
    throw new Error((data && data.error) || ('しっぱい しました（' + res.status + '）'));
  }
  return data;
}

/* とどいた ないようを ゲームに いれる */
function applySuggestion(g, x, opt){
  opt = opt || {};
  if(x.field === 'stats'){
    const o = parseJsonSafe(x.text) || {};
    STAT_KEYS.forEach(sk => { if(o[sk.k] !== undefined) g[sk.k] = Number(o[sk.k]); });
    if(Number(g.playersMin) > Number(g.playersMax)){ const t = g.playersMin; g.playersMin = g.playersMax; g.playersMax = t; }
    return;
  }
  if(x.field === 'tags'){
    const o = parseJsonSafe(x.text) || {};
    let tags = (g.tags || []).filter(t => (o.remove || []).indexOf(t) < 0);
    (o.add || []).forEach(t => {
      if(tags.indexOf(t) < 0) tags.push(t);
      if(!state.tags.some(y => y.name === t)){ state.tags.push({name:t, category:'その他'}); saveTags(); }
    });
    g.tags = tags;
    return;
  }
  if(x.field === 'image'){
    const imgs = (g.images || []).filter(u => u !== x.text);
    if(opt.asBox) imgs.unshift(x.text); else imgs.push(x.text);
    g.images = imgs;
    return;
  }
  if(x.field === 'video'){
    const vids = videosOf(g);
    if(!vids.some(v => youtubeId(v) === youtubeId(x.text))) vids.push(x.text);
    g.videos = vids; delete g.video;
    return;
  }
  g[x.field] = x.text;
  if(x.field === 'summary') g.tags = (g.tags || []).filter(t => t !== 'データみきにゅう');
}

/* ---------------- 遊んでみたい ----------------
   ずかんの ゲームを、じぶんの「遊んでみたい」に いれられる。
   じぶんで はずすまで のこる。ぼうけんしゃカードで だれが なにを
   遊んでみたいか が わかり、かんりする 人は かいの たなに いかせる。 */
function reqOf(gid){ return state.reqs[gid] || null; }
function reqCount(gid){ const r = reqOf(gid); return r ? r.n : 0; }

/* ---------------- きろくの しゃしん ----------------
   しゃしんは さかばに あずけ、この スマホには アドレスだけ のこす。
   そうすると ほぞん容量を つかわず、スマホを かえても のこる。 */
function isDataUrl(src){ return typeof src === 'string' && src.indexOf('data:') === 0; }
async function uploadOnePhoto(sid, dataUrl){
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
  if(!m) return dataUrl;
  const d = await api('/api/photo', {method:'POST', body:{play:sid, mime:m[1], data:m[2]}});
  return d.url;
}
/* まだ あずけて いない しゃしんを あずける */
async function flushPhotos(){
  if(!isOnline()) return 0;
  let done = 0;
  for(const g of state.games){
    for(const pl of playsOf(g)){
      const pics = Array.isArray(pl.p) ? pl.p : [];
      if(!pics.some(isDataUrl)) continue;
      const sid = playSid(pl);
      const out = [];
      for(const src of pics){
        if(!isDataUrl(src)){ out.push(src); continue; }
        try{ out.push(await uploadOnePhoto(sid, src)); done++; }
        catch(e){ out.push(src); }            /* おくれなければ この スマホに のこす */
      }
      pl.p = out;
    }
  }
  if(done) saveGames();
  return done;
}

/* さかばと きろくを やりとりする */
async function syncNet(){
  if(!isOnline()) return {pushed:0, got:0};
  /* さきに「けした きろく」を つたえる */
  const del = Array.isArray(state.net.del) ? state.net.del.slice() : [];
  if(del.length){
    for(let i = 0; i < del.length; i += 100){
      await api('/api/plays/delete', {method:'POST', body:{ids: del.slice(i, i + 100)}});
    }
    state.net.del = [];
    saveNet();
  }
  let photos = 0;
  try{ photos = await flushPhotos(); }catch(e){}
  let pushed = 0;
  const pending = playsToPush();
  if(pending.length){
    for(let i = 0; i < pending.length; i += 100){
      const part = pending.slice(i, i + 100);
      await api('/api/plays', {method:'POST', body:{plays: part.map(x => x.row)}});
      part.forEach(x => { x.play.pushed = 1; });
      pushed += part.length;
    }
    saveGames();
  }
  let got = 0, guard = 0;
  const removed = {};
  while(guard++ < 10){
    const d = await api('/api/plays?since=' + encodeURIComponent(state.net.since || ''));
    const byId = {};
    (state.net.plays || []).forEach(r => { byId[r.id] = r; });
    (d.plays || []).forEach(r => {
      if(r.x){ delete byId[r.id]; removed[r.id] = 1; }   /* どこかで けされた きろく */
      else { byId[r.id] = r; }
      got++;
    });
    state.net = {since: d.since || state.net.since,
                 plays: Object.keys(byId).map(k => byId[k]),
                 del: state.net.del || []};
    saveNet();
    if(!d.more) break;
  }
  const dropped = dropLocalBySid(removed);
  const imported = importOwnNetPlays();
  return {pushed, got: got + dropped + imported, photos};
}
/* ほかの スマホで けされた じぶんの きろくを、この スマホからも けす */
function dropLocalBySid(removed){
  if(!Object.keys(removed).length) return 0;
  let n = 0;
  state.games.forEach(g => {
    const ps = playsOf(g);
    const keep = ps.filter(pl => !(pl.sid && removed[pl.sid]));
    if(keep.length !== ps.length){
      ps.filter(pl => pl.sid && removed[pl.sid]).forEach(pl => addGone(playKey(g.id, pl)));
      n += ps.length - keep.length; g.plays = keep;
    }
  });
  if(n) saveGames();
  return n;
}
/* ほかの スマホで つけた じぶんの きろくを、この スマホの きろくに とりこむ。
   おなじ ぼうけんしゃの証なら、どの スマホでも おなじ きろくに なる。
   かんそうは その スマホだけの ものなので はいって こない。 */
function importOwnNetPlays(){
  const me = account();
  if(!me) return 0;
  const local = {};
  state.games.forEach(g => playsOf(g).forEach(pl => {
    if(pl.sid) local[pl.sid] = 1;
    local['k|' + playKey(g.id, pl)] = 1;
  }));
  let n = 0;
  (state.net.plays || []).forEach(r => {
    if(r.owner !== me.id || local[r.id]) return;
    const g = state.games.find(x => x.id === r.g);
    if(!g) return;                                   /* ずかんに ない ゲームは そのまま */
    const pl = netToPlay(r);
    const key = playKey(g.id, pl);
    if(isGone(key) || local['k|' + key]) return;
    pl.sid = r.id; pl.pushed = 1;
    pl.share = r.s === 'me' ? 'me' : 'friends';
    if(Array.isArray(r.pic) && r.pic.length) pl.p = r.pic.slice();
    g.plays = playsOf(g).concat([pl]);
    local[r.id] = 1; local['k|' + key] = 1;
    n++;
  });
  if(n) saveGames();
  return n;
}

   アプリを ひらいた とき・もうしこみが とどいた ときに 1人ずつ たずねる。
   そとを おして とじたら「あとで」（この ひらいて いる あいだは もう きかない）。 */
function askFriendRequests(){
  if(askFriendRequests.busy) return;
  const seen = askFriendRequests.seen || (askFriendRequests.seen = {});
  const next = ((state.friends && state.friends.incoming) || []).find(x => !seen[x.id]);
  if(!next) return;
  seen[next.id] = 1;
  askFriendRequests.busy = true;
  const done = () => { askFriendRequests.busy = false; setTimeout(askFriendRequests, 300); };
  ask(next.name + ' が なかまに なりたそうに こちらを みている！\nなかまに してあげますか？', async () => {
    try{
      await api('/api/friend/accept', {method:'POST', body:{id:next.id}});
      await refreshFriends(); await syncNet(); render();
      playFanfare();
      toast(next.name + ' が なかまに くわわった！');
    }catch(e){ toast(e.message); }
    done();
  }, {
    yes: 'なかまに する',
    no: 'ことわる',
    onNo: async () => {
      try{ await api('/api/friend/remove', {method:'POST', body:{id:next.id}}); await refreshFriends(); render(); }
      catch(e){ toast(e.message); }
      done();
    },
    onBack: () => { done(); }
  });
}

        const d = await api('/api/rename', {method:'POST', body:{name}});
        const old = account();
        saveAccount({id:d.id, name:d.name, code:d.code, token:old.token});
        if(old && old.name && old.name !== d.name) renamePlayer(old.name, d.name);
        render();
        toast('なまえを かえました');
      }catch(e){ acctStatus(e.message, 'ng'); }
    });
  };

  const copyCode = document.getElementById('acctCopy');
  if(copyCode) copyCode.onclick = () => {
    const a = account();
    if(a && a.code) copyText(a.code);
  };

  const transfer = document.getElementById('acctTransfer');
  if(transfer) transfer.onclick = async () => {
    acctStatus('ひきつぎコードを つくって います…');
    try{
      const d = await api('/api/transfer', {method:'POST'});
      const box = document.getElementById('acctTransferBox');
      if(box){
        box.innerHTML = '<div class="win" style="margin-bottom:8px;text-align:center">' +
          '<p class="count" style="margin:0 0 6px">ひきつぎコード（10分だけ つかえます）</p>' +

          '<button class="mini" id="acctCopyTransfer">コピーする</button></div>';
        const c = document.getElementById('acctCopyTransfer');
        if(c) c.onclick = () => copyText(d.code);
      }
      acctStatus('あたらしい スマホの「まえの スマホから ひきつぐ」に いれて ください', 'ok');
    }catch(e){ acctStatus(e.message, 'ng'); }
  };

  bindFriends();
  const sync = document.getElementById('netSync');
  if(sync) sync.onclick = async () => {
    sync.disabled = true;
    acctStatus('さかばと やりとり して います…');
    try{
      const r = await syncNet();
      await refreshFriends();
      render();
      toast('あずけた '+r.pushed+'けん／うけとった '+r.got+'けん');
    }catch(e){ acctStatus(e.message, 'ng'); sync.disabled = false; }
  };

  const logout = document.getElementById('acctLogout');
  if(logout) logout.onclick = () => ask(
    'この スマホから ぼうけんしゃの証を けします。\nひきつぎコードが ないと もどれません。',
    () => {

      state.friends = {friends:[], incoming:[], outgoing:[]};
      state.profile = {title:'', titles:[], favs:[], bio:'', job:''}; saveProfileLocal();
      render(); toast('はなれました');
    });
}

function fmtVer(v){
  const d = new Date(v);
  if(!v || isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
/* iPhone の Safari で ひらいて いて、この 端末に じぶんの データが ある 人への おしらせ */
function isIosSafariTab(){
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return ios && !navigator.standalone && !(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
}
function hasOwnData(){
  return !!account() || state.games.some(g => playsOf(g).length) || (state.players || []).length > 0;
}

/* ---------------- ほぞん容量 ----------------
   しゃしんは 文字に なおして 端末に ためて いる。
   ブラウザの 上限（だいたい 5MB）に ちかづくと ほぞん できなく なるので、
   いま どれくらい つかって いるかを みえる ように する。 */
const STORAGE_LIMIT = 5 * 1024 * 1024;

function storageUsed(){
  let total = 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('bgl.') === 0){
        const v = localStorage.getItem(k) || '';
        total += (k.length + v.length) * 2;   /* 1もじ 2バイトで かぞえる */
      }
    }
  }catch(e){ return 0; }
  return total;
}
function formatBytes(n){
  if(n >= 1024*1024) return (n / (1024*1024)).toFixed(1) + 'MB';
  if(n >= 1024) return Math.round(n / 1024) + 'KB';
  return n + 'バイト';
}
function storageRatio(){ return Math.min(1, storageUsed() / STORAGE_LIMIT); }

function storageMeterHTML(){
  const used = storageUsed();
  const pct = Math.round(storageRatio() * 100);
  const level = pct >= 85 ? 'ng' : (pct >= 60 ? 'warn' : 'ok');
  const msg = pct >= 85
    ? 'いっぱいに ちかづいて います。これいじょう しゃしんを ふやすと ほぞん できなく なることが あります。'
    : (pct >= 60
      ? 'はんぶんを こえました。あたらしい しゃしんは URLで いれると 容量を つかいません。'
      : 'まだ よゆうが あります。');
  return '<div class="meter meter-'+level+'"><span style="width:'+pct+'%"></span></div>' +
    '<p class="count" style="margin:6px 0 0">つかって いる 容量：'+formatBytes(used)+' ／ やく5MB（'+pct+'%）<br>'+esc(msg)+'</p>';
}

/* ---------------- こうかい するとき に かくす もの ----------------
   あそんだ きろく（かんそう ふくむ）と かしだし先の なまえは、
   じぶんと なかまうちの メモ。GitHub は だれでも 見られるので、
   こうかい用の データからは とりのぞく。 */
const PRIVATE_FIELDS = ['plays', 'lentTo', 'lentDate'];

function sharePrivateOn(){ return store.read(KEY.sharePriv, false); }

function gamesForPublish(){
  if(sharePrivateOn()) return state.games;
  return state.games.map(g => {
    const copy = Object.assign({}, g);
    PRIVATE_FIELDS.forEach(f => { delete copy[f]; });
    return copy;
  });
}
/* とりこむ とき、この端末に ある きろくは のこす */
function mergePrivate(incoming){
  const mine = {};
  state.games.forEach(g => { mine[g.id] = g; });
  return incoming.map(g => {
    const old = mine[g.id];
    if(!old) return g;
    if((!Array.isArray(g.plays) || !g.plays.length) && Array.isArray(old.plays) && old.plays.length) g.plays = old.plays;
    if(!g.lentTo && old.lentTo){ g.lentTo = old.lentTo; g.lentDate = old.lentDate; }
    return g;
  });
}

/* ---------------- サイトの じどう こうしん ----------------
   GitHub の API を つかって、こうかい中の library.json を
   ボタン ひとつで おきかえる。トークンは この端末にだけ ほぞんされる。 */
function getSiteConfig(){
  const c = store.read(KEY.gh, {}) || {};
  return { owner:c.owner||'', repo:c.repo||'', branch:c.branch||'main', token:c.token||'' };
}
function saveSiteConfig(c){ store.write(KEY.gh, c); }

function toBase64Utf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for(let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function pubStatus(msg, kind){
  const el = document.getElementById('pubStatus');
  if(!el) return;
  const color = kind === 'ng' ? 'var(--danger)' : (kind === 'ok' ? 'var(--accent)' : 'var(--muted)');
  el.innerHTML = '<p class="count" style="color:'+color+';margin:10px 0 0">'+esc(msg)+'</p>';
}
/* サイトに ファイルを 1つ おく（library.json） */
async function putSiteFile(path, obj, cfg){
  const api = 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' +
              encodeURIComponent(cfg.repo) + '/contents/' + path;
  const headers = { 'Authorization':'Bearer ' + cfg.token, 'Accept':'application/vnd.github+json' };

  let sha = null;
  const cur = await fetch(api + '?ref=' + encodeURIComponent(cfg.branch), {headers});
  if(cur.status === 200){ sha = (await cur.json()).sha; }
  else if(cur.status === 401){ throw new Error('トークンの きげんが きれたか、まちがって います。GitHubで あたらしい トークンを つくり、したの「サイトこうしんの せってい」に いれなおして ください。'); }
  else if(cur.status === 403){ throw new Error('この トークンには かきこむ けんげんが ありません。GitHubで トークンの「Contents」を「Read and write」に して ください。'); }
  else if(cur.status !== 404){ throw new Error('サイトが みつかりません。ユーザーめいと おきばの なまえを たしかめて ください。'); }

  const payload = {
    message: path + ' を こうしん',
    content: toBase64Utf8(JSON.stringify(obj, null, 2)),
    branch: cfg.branch
  };
  if(sha) payload.sha = sha;

  const put = await fetch(api, {
    method:'PUT',
    headers: Object.assign({'Content-Type':'application/json'}, headers),
    body: JSON.stringify(payload)
  });
  if(!put.ok){
    if(put.status === 401) throw new Error('トークンの きげんが きれたか、まちがって います。したの「サイトこうしんの せってい」で いれなおして ください。');
    if(put.status === 403) throw new Error('この トークンには かきこむ けんげんが ありません（Contents を Read and write に）。');
    if(put.status === 404) throw new Error('おきばが みつかりません。ユーザーめい・おきばの なまえ・ブランチを たしかめて ください。');
    if(put.status === 409) throw new Error('ブランチの なまえが ちがうかも しれません（main か master）。');
    throw new Error('こうしん できませんでした（' + put.status + '）。');
  }
}
function siteConfigFromForm(){
  const f = id => (document.getElementById(id) || {value:''}).value.trim();
  const saved = getSiteConfig();
  const cfg = {
    owner: f('ghOwner') || saved.owner,
    repo:  f('ghRepo')  || saved.repo,
    branch:f('ghBranch') || saved.branch || 'main',
    token: f('ghToken') || saved.token
  };
  if(cfg.owner && cfg.repo && cfg.token) saveSiteConfig(cfg);
  return cfg;
}
async function publishToSite(){
  const cfg = siteConfigFromForm();
  if(!cfg.owner || !cfg.repo || !cfg.token){
    pubStatus('さいしょの せっていを ぜんぶ いれて ください。', 'ng');
    return;
  }
  const btn = document.getElementById('publishBtn');
  if(btn) btn.disabled = true;
  pubStatus('サイトに つないで います…');
  try{
    const ver = new Date().toISOString();
    const pubGames = gamesForPublish();
    await putSiteFile('library.json', {version:ver, tags:state.tags, games:pubGames}, cfg);
    store.write(KEY.pubver, ver);
    store.write(KEY.pubOk, ver);
    clearDirty();
    siteInfo = {version:ver, games:pubGames, tags:state.tags, at:Date.now()};
    pendingSiteData = null;
    const box = document.getElementById('syncBox');
    if(box) box.outerHTML = syncBoxHTML();
    pubStatus('こうしん しました！ 1〜2ふん あとに ともだちの がめんにも でます。', 'ok');
    toast('サイトを こうしん しました');
  }catch(err){
    pubStatus((err && err.message) ? err.message : 'つうしんに しっぱい しました。でんぱを たしかめて ください。', 'ng');
  }finally{
    if(btn) btn.disabled = false;
  }
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('コピーしました'), ()=>toast('コピーできませんでした'));
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('コピーしました'); }
  catch(e){ toast('コピーできませんでした'); }
  ta.remove();
}

/* ---------------- actions ---------------- */
function roll(){
  const f = state.filters;
  const res = search(f);
  let pool = hasFilter(f) ? res.perfect : poolGames();
  let fallback = false;
  if(!pool.length && res.near.length){ pool = res.near; fallback = true; }

  const slot = document.getElementById('randomSlot');
  if(!slot) return;

  if(!pool.length){
    slot.innerHTML = '<div class="empty"><span class="mark" data-icon="search"></span>じょうけんに あう ゲームが みつからない！' +
      '<div style="margin-top:16px"><button class="btn small" data-go2="#/">じょうけんを えらびなおす</button></div></div>';
    paintIcons(slot); bind(currentRoute()); return;
  }

  let pick = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length > 1 && pick.id === state.lastRandomId) pick = pool[(pool.indexOf(pick)+1) % pool.length];
  state.lastRandomId = pick.id;

  slot.innerHTML = '<div class="roll-stage"><span class="die shaking" data-icon="die"></span>' +
    '<p class="encounter blink">＊ シャッフル ちゅう…</p></div>';
  paintIcons(slot);

  setTimeout(() => {
    slot.innerHTML = (fallback ? '<div class="note" style="margin-bottom:12px">ぴったりの 1本が いなかったので、ちかい ゲームから えらびました。</div>' : '')
      + randomResultHTML(pick);
    paintIcons(slot); bind(currentRoute());
    playFanfare();
  }, 700);
}

function saveForm(id){
  const val = s => (document.getElementById(s)||{value:''}).value;
  const num = s => Number(val(s))||0;
  const hidden = n => Number((document.querySelector('input[name="'+n+'"]')||{value:0}).value)||0;

  const title = val('f-title').trim();
  if(!title) return toast('タイトルを いれてください');

  /* おなじ（または よく にた）なまえが すでに ないか しらべる */
  const nq = normalizeText(title);
  const same = state.games.filter(x => x.id !== id && normalizeText(x.title) === nq);
  if(same.length){
    ask('「'+same[0].title+'」が すでに とうろく されて います。\nそれでも あたらしく ついか しますか？',
        () => saveFormGo(id, title));
    return;
  }
  saveFormGo(id, title);
}

function saveFormGo(id, title){
  const val = s => (document.getElementById(s)||{value:''}).value;
  const num = s => Number(val(s))||0;
  const hidden = n => Number((document.querySelector('input[name="'+n+'"]')||{value:0}).value)||0;

  let pmin = Math.max(1,num('f-pmin')), pmax = Math.max(1,num('f-pmax'));
  if(pmin > pmax){ const t = pmin; pmin = pmax; pmax = t; }

  const before = id ? state.games.find(g => g.id === id) : null;
  const data = {
    id: id || uid(),
    title,
    reading: val('f-reading').trim(),
    videos: state.formVideos.slice(),
    wish: !!(document.getElementById('f-wish') || {}).checked,
    plays: before ? playsOf(before) : [],
    lentTo: before ? (before.lentTo || '') : '',
    lentDate: before ? (before.lentDate || '') : '',
    images: state.formImages.slice(),
    playersMin: pmin, playersMax: pmax,
    playTime: Math.max(1,num('f-time')), age: num('f-age'),
    difficulty: hidden('difficulty'), strategy: hidden('strategy'),
    excitement: hidden('excitement'), luck: hidden('luck'), replay: hidden('replay'),
    tags: state.formTags.slice(),
    summary: val('f-summary').trim(),
    quickRule: val('f-quick'), detailRule: val('f-detail'), recommendation: val('f-reco')
  };

  /* ずかんに くわわった日：もって いる ゲームに なった ときに つける */
  const wasOwned = !!(before && !before.wish);
  data.addedAt = wasOwned ? (before.addedAt || '')
    : (data.wish ? (before ? (before.addedAt || '') : '') : todayStr());

  if(id){
    const i = state.games.findIndex(g => g.id === id);
    if(i >= 0) state.games[i] = data;
  }else{
    state.games.unshift(data);
  }
  saveGames();
  toast(id ? 'セーブしました' : title + ' を なかまに した！');
  go('#/game/' + data.id);
}

function removeGame(id){
  const g = state.games.find(x => x.id === id);
  if(!g) return;
  ask('「'+g.title+'」を けします。\nよろしいですか？', () => {
    playsOf(g).forEach(pl => forgetPlay(g.id, pl));
    state.games = state.games.filter(x => x.id !== id);
    saveGames(); toast('けしました'); go('#/admin'); render(); autoSync();
  });
}

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* さいごに ひかえを つくってから 何日 たったか */
function daysSinceBackup(){
  const last = store.read(KEY.backupAt, '');
  if(!last) return null;
  const d = new Date(last + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function backupNoticeHTML(){
  const days = daysSinceBackup();
  if(days === null){
    return '<div class="note" style="margin-bottom:12px">' +
      'まだ 一度も ひかえを つくって いません。<br>' +
      'ブラウザの データを けすと ぜんぶ きえて しまうので、ときどき ひかえを ほぞん して ください。</div>';
  }
  if(days >= 30){
    return '<div class="note" style="margin-bottom:12px;border-style:solid;border-color:var(--accent);color:var(--text)">' +
      '▶ さいごに ひかえを つくってから '+days+'日 たちました。<br>あたらしい ひかえを ほぞん して おきましょう。</div>';
  }
  return '<p class="count" style="margin:0 0 12px">さいごの ひかえ：'+days+'日まえ</p>';
}

function importLibrary(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.games)) throw new Error('format');
      state.games = data.games;
      if(Array.isArray(data.tags) && data.tags.length) state.tags = data.tags;
      store.write(KEY.games, state.games);
      store.write(KEY.tags, state.tags);
      markDirty();                                  /* この端末の ないようを まもる */
      if(data.version) store.write(KEY.pubver, String(data.version));
      render(); toast('よみこみました（'+data.games.length+'さくひん）');
    }catch(err){ toast('よみこめませんでした。ほぞんした データの ファイルを えらんで ください'); }
  };
  fr.readAsText(file);
  e.target.value = '';
}

/* 拡大ひょうじの ボタン（さいしょに 1かいだけ つける） */
(function setupLightbox(){
  const back = document.getElementById('lightbox');
  if(!back) return;
  document.getElementById('lbClose').onclick = closeLightbox;
  document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); stepLightbox(-1); };
  document.getElementById('lbNext').onclick = e => { e.stopPropagation(); stepLightbox(1); };
  back.onclick = e => {
    /* しゃしん そのものを タップした ときは とじない（ひろげて 見られる ように） */
    if(e.target.id !== 'lbImg') closeLightbox();
  };
  document.addEventListener('keydown', e => {
    if(back.hidden) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') stepLightbox(-1);
    if(e.key === 'ArrowRight') stepLightbox(1);
  });

  /* よこに スワイプしても めくれる */
  let sx = 0, sy = 0;
  const stage = back.querySelector('.lb-stage');
  stage.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener('touchend', e => {
    if(!e.changedTouches || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) stepLightbox(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

  const clampM = (v, min, max) => Math.max(min, Math.min(max, v));
  function placeMemoBadge(x, y){
    const w = memoBadgeEl.offsetWidth || 46, h = memoBadgeEl.offsetHeight || 42;
    const nx = clampM(x, 4, window.innerWidth - w - 4);
    const ny = clampM(y, 4, window.innerHeight - h - 4);
    memoBadgeEl.style.left = nx + 'px';
    memoBadgeEl.style.top = ny + 'px';
    memoBadgeEl.style.right = 'auto';
    memoBadgeEl.style.bottom = 'auto';
    return {x:nx, y:ny};
  }
  const savedM = store.read(KEY_MPOS, null);
  if(savedM && typeof savedM.x === 'number'){
    requestAnimationFrame(() => placeMemoBadge(savedM.x, savedM.y));
  }
  window.addEventListener('resize', () => {
    if(memoBadgeEl.style.left){
      const r = memoBadgeEl.getBoundingClientRect();
      placeMemoBadge(r.left, r.top);
    }
  });
  memoBadgeEl.addEventListener('pointerdown', e => {
    const r = memoBadgeEl.getBoundingClientRect();
    mdrag = {dx: e.clientX - r.left, dy: e.clientY - r.top, moved:false};
    memoBadgeEl.setPointerCapture(e.pointerId);
    memoBadgeEl.classList.add('dragging');
  });
  memoBadgeEl.addEventListener('pointermove', e => {
    if(!mdrag) return;
    if(Math.abs(e.movementX) + Math.abs(e.movementY) > 0) mdrag.moved = true;
    placeMemoBadge(e.clientX - mdrag.dx, e.clientY - mdrag.dy);
  });
  const endMDrag = () => {
    if(!mdrag) return;
    memoBadgeEl.classList.remove('dragging');
    if(mdrag.moved){
      const r = memoBadgeEl.getBoundingClientRect();
      store.write(KEY_MPOS, {x:r.left, y:r.top});
    }else{
      playClick();
      go('#/tool/memo');
    }
    mdrag = null;
  };
  memoBadgeEl.addEventListener('pointerup', endMDrag);
  memoBadgeEl.addEventListener('pointercancel', endMDrag);
}

const timerBadgeEl = document.getElementById('timerBadge');
if(timerBadgeEl){
  const KEY_POS = 'bgl.timerBadgePos';
  let drag = null;

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function placeBadge(x, y){
    const w = timerBadgeEl.offsetWidth || 120;
    const h = timerBadgeEl.offsetHeight || 40;
    const nx = clamp(x, 4, window.innerWidth  - w - 4);
    const ny = clamp(y, 4, window.innerHeight - h - 4);
    timerBadgeEl.style.left = nx + 'px';
    timerBadgeEl.style.top  = ny + 'px';
    timerBadgeEl.style.right = 'auto';
    timerBadgeEl.style.bottom = 'auto';
    return {x:nx, y:ny};
  }
  /* まえに おいた ばしょを おぼえて おく */
  const saved = store.read(KEY_POS, null);
  if(saved && typeof saved.x === 'number'){
    requestAnimationFrame(() => placeBadge(saved.x, saved.y));
  }
  /* 画面の むきが かわった ときは 画面の 中に もどす */
  window.addEventListener('resize', () => {
    if(timerBadgeEl.style.left){
      const r = timerBadgeEl.getBoundingClientRect();
      placeBadge(r.left, r.top);
    }
  });

  timerBadgeEl.addEventListener('pointerdown', e => {
    const r = timerBadgeEl.getBoundingClientRect();
    drag = {dx: e.clientX - r.left, dy: e.clientY - r.top, moved:false};
    timerBadgeEl.setPointerCapture(e.pointerId);
    timerBadgeEl.classList.add('dragging');
  });
  timerBadgeEl.addEventListener('pointermove', e => {
    if(!drag) return;
    const x = e.clientX - drag.dx, y = e.clientY - drag.dy;
    if(Math.abs(e.movementX) + Math.abs(e.movementY) > 0) drag.moved = true;
    placeBadge(x, y);
  });
  const endDrag = e => {
    if(!drag) return;
    timerBadgeEl.classList.remove('dragging');
    if(drag.moved){
      const r = timerBadgeEl.getBoundingClientRect();
      store.write(KEY_POS, {x:r.left, y:r.top});     /* ばしょを おぼえる */
    }else{
      playClick();
      go('#/tool/timer');                            /* うごかさなければ タップ */
    }
    drag = null;
  };
  timerBadgeEl.addEventListener('pointerup', endDrag);
  timerBadgeEl.addEventListener('pointercancel', endDrag);
}

/* つまずいた ところを 画面で わかる ように して おく。
   （ふだんは でない。でた ときは その ままを おしえて もらえば なおせる） */
window.addEventListener('error', ev => {
  const msg = (ev && ev.message) ? ev.message : 'ふめいな エラー';
  const where = (ev && ev.lineno) ? '（'+ev.lineno+'行め）' : '';
  try{ toast('エラー：' + msg + where); }catch(e){}
});
window.addEventListener('unhandledrejection', ev => {
  try{ toast('エラー：' + ((ev.reason && ev.reason.message) || ev.reason || '')); }catch(e){}
});

paintIcons(document);
initAudio();
initSoundButtons();
document.addEventListener('pointerdown', unlockAudioOnce, {once:true});
/* あみだくじ：なまえ／のこりの 人の ボタンを おした ときの しょり。
   ボタンは 画面を かき直す たびに つくり直されるので、
   1つ1つに つなぐのでは なく、ここで まとめて うけとる。 */
/* けっかを ひらく。えんしゅつの とちゅうで なにか あっても、
   さいごは かならず けっかが でる ように して ある。 */
/* あたりか どうかを ことばから みわける */
function amidaIsHit(goal){
  const g = String(goal || '');
  return /あたり|アタリ|当たり|１ばん|1ばん|優勝|かち/.test(g);
}
function amidaOpenNow(i){
  const a = state.amida;
  if(!a) return;
  const t = amidaTrace(a, i);
  if((a.opened || []).indexOf(i) < 0) a.opened.push(i);
  const goal = a.goals[t.end];
  a.result = {all:null, path:t.path, one:{name:a.names[i], goal:goal, hit:amidaIsHit(goal)}, tracing:false};
  try{ render(); }catch(e){}
  try{
    /* 画面ぜんたいが 一しゅん ひかる */
    flashScreen('hit');
    /* あみだくじは だれの ばんでも おなじ「けっかの おと」を ならす。
       （まえは「1ばんめ」を あたりと みなして いたので、
         1ばん手の 人だけ ちがう おとに なって いた） */
    playHitSe();
  }catch(e){}
}

/* ③ 画面が 一しゅん ひかる */
function flashScreen(kind){
  const el = document.getElementById('flash');
  if(!el) return;
  el.className = '';
  void el.offsetWidth;                 /* うごきを やりなおす ため */
  el.className = 'on ' + (kind === 'hit' ? 'hit' : '');
  setTimeout(() => { el.className = ''; }, 700);
}
function amidaPathTap(i){
  const a = state.amida;
  if(!a) return;
  if(a.phase !== 'reveal'){
    toast('「はっぴょうを はじめる」を おしてから えらべます');
    return;
  }
  if((a.opened || []).indexOf(i) >= 0){
    /* もう ひらいた 人は、みちすじを もう一度 みせる だけ */
    amidaOpenNow(i);
    return;
  }

  clearTimeout(amidaPathTap._t);

  /* えんしゅつ（線が はしる）。うまく いかない ときは すぐ けっかへ。 */
  let wait = 1400;
  try{
    const t = amidaTrace(a, i);
    wait = Math.min(2900, 1100 + t.path.length * 90);
    a.result = {all:null, path:t.path, one:null, tracing:true, who:a.names[i]};
    render();
    playClick();

    /* ④ 線が すすむ あいだ、ことこと おとを ならす */
    clearInterval(amidaPathTap._step);
    let n = 0;
    const steps = Math.max(3, t.path.length);
    amidaPathTap._step = setInterval(() => {
      playStepSe();
      if(++n >= steps) clearInterval(amidaPathTap._step);
    }, Math.max(90, Math.round(wait / steps)));
  }catch(e){
    amidaOpenNow(i);
    return;
  }

  amidaPathTap._t = setTimeout(() => {
    clearInterval(amidaPathTap._step);
    const cur = state.amida;
    if(!cur || cur.phase !== 'reveal') return;
    amidaOpenNow(i);
    /* ② じどうで つぎの人へ */
    if(cur.autoReveal){
      const rest = cur.names.map((_, k) => k).filter(k => (cur.opened || []).indexOf(k) < 0);
      if(rest.length) setTimeout(() => amidaPathTap(rest[0]), 1600);
      else cur.autoReveal = false;
    }
  }, wait);
}
document.addEventListener('click', e => {
  if(!e.target.closest) return;
  const p = e.target.closest('[data-amidapath]');
  if(p){ amidaPathTap(Number(p.dataset.amidapath)); return; }

  /* よこ線を ひく・けす */
  const d = e.target.closest('[data-amida]');
  if(d){
    const a = state.amida;
    if(!a || a.phase !== 'edit') return;
    const parts = String(d.dataset.amida).split('|');
    const y = Number(parts[0]), x = Number(parts[1]);
    const cols = a.names.length - 1;
    if(!a.rows[y][x]){
      if((x > 0 && a.rows[y][x-1]) || (x < cols-1 && a.rows[y][x+1])){
        return toast('となりどうしの よこ線は ひけません');
      }
    }
    a.rows[y][x] = !a.rows[y][x];
    a.result = null;
    render();
  }
});

document.addEventListener('click', e => {
  if(e.target.closest('.btn, .chip, .tab, .mini, .gcard, .icon-btn, .filebtn, .starpick button, ' +
    '.tool-card, .gtile, .score-cell, .lb-nav, #timerBadge, summary, .jb-track')) playClick();
});

loadAll();
adoptKaiFromUrl();

syncPublished();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
/* ログイン して いれば、そっと さかばと やりとり する */
if(isOnline()){
  (async () => {
    try{
      await flushFriendWait();
      const r = await syncNet();
      const fch = await refreshFriends();
      let rch = false, pch = false;
      try{ rch = await refreshRequests(); }catch(e){}
      try{ pch = await refreshProfile(); await recordEarnedTitles(); }catch(e){}
      if(r.got || r.pushed || fch || rch || pch) render();
      askFriendRequests();
    }catch(e){ /* つながらなければ この スマホの ぶんだけで うごく */ }
  })();
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
