/* =========================================================
   Board Game Library — 8bit RPG theme
   ========================================================= */
:root{
  /* よる（既定） */
  --bg:#141C3A;
  --bg-2:#1C2650;
  --panel:#0A0E24;
  --frame:#FFFFFF;
  --text:#FFFFFF;
  --muted:#9DB2DE;
  --accent:#F8D030;   /* ゴールド */
  --accent-2:#5CD6FF; /* みず */
  --danger:#FF6B5E;
  --shadow:4px 4px 0 rgba(0,0,0,.55);
  --scrim:rgba(10,14,36,.76);
  --px:16px;
  --font:"DotGothic16","HiraMaruProN-W4","Hiragino Maru Gothic ProN","MS Gothic","Osaka-mono",monospace;
}
html[data-theme="day"]{
  --bg:#E8E1CE;
  --bg-2:#FFFFFF;
  --panel:#FFFFFF;
  --frame:#12141E;
  --text:#12141E;
  --muted:#3E4354;
  --accent:#0F3FA8;
  --accent-2:#8A2E12;
  --danger:#B0271A;
  --shadow:4px 4px 0 rgba(32,34,58,.30);
  --scrim:rgba(250,246,236,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ボタンを つづけて はやく おした ときに、iPhone が
   「ダブルタップ＝かくだい」と かんちがい しない ように する */
button,.chip,.mini,.tab,.icon-btn,.lb-nav,.gcard,.gtile{touch-action:manipulation}
html{margin:0;padding:0;background:transparent;color-scheme:dark}
html[data-theme="day"]{color-scheme:light}
body{
  margin:0;padding:0;
  background:transparent;
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.85;
  letter-spacing:.02em;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:none;
  padding-top:calc(56px + 3px + env(safe-area-inset-top));   /* 固定した 上バーの ぶん */
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overflow-wrap:anywhere;
}
/* 走査線（よるのみ・ごく薄く） */
body::after{
  content:"";position:fixed;inset:0;z-index:99;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  opacity:.5;
}
html[data-theme="day"] body::after{display:none}
/* ドット文字は細いので、あかるい画面では少し太らせて読みやすくする */
html[data-theme="day"] body{text-shadow:0.5px 0 0 currentColor}
html[data-theme="day"] .win,
html[data-theme="day"] .section,
html[data-theme="day"] .gcard,
html[data-theme="day"] .roll-stage{border-width:3px}
html[data-theme="day"] .tag{border-color:var(--muted);color:var(--muted)}

button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-weight:400;margin:0;letter-spacing:.04em}
p{margin:0 0 .8em}
img{image-rendering:auto}

.wrap{max-width:600px;margin:0 auto;padding:0 14px}
#app{min-height:calc(100vh - 150px)}

#bg::after{content:"";position:absolute;inset:0;background:var(--scrim)}

/* ---------- ウィンドウ枠（ドラクエ風） ---------- */
.win{
  background:var(--panel);
  border:3px solid var(--frame);
  box-shadow:var(--shadow);
  padding:14px 15px;
  position:relative;
}
.win + .win{margin-top:12px}

/* ---------- ヘッダー ---------- */
.topbar{
  /* fixed で かんぜんに 固定する。
     あたらしい iOS の Safari は 画面の 上べりで 中身を うすく かすませる ので、
     かならず じぶんの そうで 立つ ように して、その えいきょうを へらす。 */
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--panel);
  border-bottom:3px solid var(--frame);
  padding-top:env(safe-area-inset-top);
  transform:translateZ(0);
  isolation:isolate;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
/* iPhone の 上べり（safe area）を ふさぐ ふた */
.topbar::before{
  content:"";position:absolute;left:0;right:0;bottom:100%;
  height:100vh;                       /* 上むきに たっぷり ぬる */
  background:var(--panel);
  transform:translateZ(0);
}
.topbar-in{
  display:flex;align-items:center;gap:10px;
  height:56px;max-width:600px;margin:0 auto;padding:4px 14px 0;
}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-size:14px;letter-spacing:.1em;color:var(--accent)}
.brand .ico{width:22px;height:22px;display:block;color:var(--accent)}
.spacer{flex:1}
.icon-btn{
  border:2px solid var(--frame);background:var(--bg-2);color:var(--text);
  padding:7px 11px;font-size:12.5px;cursor:pointer;letter-spacing:.08em;
  position:relative;z-index:1;
}
.icon-btn:active{transform:translate(1px,1px)}
.icon-btn.snd{min-width:38px;padding:5px 8px;letter-spacing:0}
.icon-btn.off{opacity:.4;text-decoration:line-through;color:var(--muted)}
/* ひろい画面では えいごの フルネーム、せまい画面では みじかい 日本語 */
.brand .txt-short{display:none}
@media (max-width:560px){
  .brand .txt-long{display:none}
  .brand .txt-short{display:inline}
  .brand{font-size:12px;letter-spacing:.02em;gap:7px;white-space:nowrap}
  .topbar-in{gap:7px;padding:0 12px}
  .icon-btn.snd{min-width:34px;padding:5px 6px}
  .icon-btn{padding:5px 8px}
}
@media (max-width:340px){
  .brand .txt-short{display:none}     /* うんと せまい ときだけ アイコンだけに */
}

/* ---------- タブ ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--panel);border-top:3px solid var(--frame);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
.tab{
  border:0;background:none;padding:8px 0 10px;display:grid;gap:1px;justify-items:center;
  color:var(--muted);font-size:11px;cursor:pointer;letter-spacing:.06em;
}
.tab .i{width:22px;height:22px;display:block}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"] .i{filter:drop-shadow(0 0 3px currentColor)}
.tab{position:relative}
.tab .dot{
  position:absolute;top:4px;right:calc(50% - 18px);
  width:9px;height:9px;background:var(--accent);border:2px solid var(--panel);
}

/* ---------- 見出し・文字 ---------- */
.page{padding:18px 0 30px}
.lede{font-size:21px;line-height:1.5;color:var(--accent);margin:0 0 8px}
.lede::before{content:"▶ ";font-size:16px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.7}
.count{font-size:12.5px;color:var(--muted);margin:0 0 10px}

.field{margin:0 0 18px}
.field > h2{font-size:15px;margin:0 0 10px;color:var(--accent-2)}
.field > h2 em{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:8px}
.catlabel{font-size:11.5px;color:var(--muted);margin:0 0 6px}

/* ---------- コマンド（チップ） ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:2px solid var(--frame);background:var(--panel);color:var(--text);
  padding:7px 12px;font-size:14px;cursor:pointer;line-height:1.4;
}
.chip::before{content:"　";white-space:pre}
.chip[aria-pressed="true"]{background:var(--text);color:var(--panel);border-color:var(--text);font-weight:400}
.chip[aria-pressed="true"]::before{content:"▶"}
.chip.sm{font-size:12.5px;padding:5px 9px}
.chip.sm.today{border-color:var(--accent-2);color:var(--accent-2)}

.tagline{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2px 7px;border:1px solid var(--muted);color:var(--muted)}
.tag.hit{border-color:var(--accent);color:var(--accent)}

/* ---------- ボタン ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px 16px;border:3px solid var(--frame);background:var(--panel);color:var(--text);
  font-size:16px;letter-spacing:.06em;cursor:pointer;box-shadow:var(--shadow);
}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{color:var(--accent);border-color:var(--accent)}
.btn.big{font-size:18px;padding:17px}
.btn.danger{color:var(--danger);border-color:var(--danger);box-shadow:none}
.btn.small{width:auto;padding:8px 12px;font-size:13px;box-shadow:none;border-width:2px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.cursor::before{content:"▶";color:var(--accent);margin-right:6px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- ゲームカード ---------- */
.card-list{display:grid;gap:12px}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:360px){.tile-grid{grid-template-columns:repeat(2,1fr)}}
.gtile{
  display:flex;flex-direction:column;gap:5px;padding:7px;width:100%;
  background:var(--panel);border:3px solid var(--frame);box-shadow:var(--shadow);
  color:var(--text);text-align:center;cursor:pointer;
}
.gtile:active{transform:translate(2px,2px);box-shadow:none}
.thumb.tile{width:100%;height:auto;aspect-ratio:1/1;min-height:0}
.thumb.tile .glyph{font-size:26px}
.gtile-name{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gtile-meta{font-size:10.5px;color:var(--muted)}
.gtile-marks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.gtile-marks .badge{margin:0;font-size:9.5px;padding:0 4px}
.gcard{
  display:grid;grid-template-columns:88px 1fr;gap:12px;width:100%;text-align:left;
  background:var(--panel);border:3px solid var(--frame);box-shadow:var(--shadow);
  padding:11px;cursor:pointer;color:var(--text);align-items:start;
}
.gcard:active{transform:translate(2px,2px);box-shadow:none}
.thumb{
  width:88px;height:88px;border:2px solid var(--frame);background:var(--bg-2);
  display:grid;place-items:center;overflow:hidden;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .glyph{font-size:30px;color:var(--accent);line-height:1}
.thumb.mini{width:38px;height:38px;flex:0 0 auto}
.thumb.mini .glyph{font-size:15px}
.gcard h3{font-size:16px;line-height:1.4;margin:0 0 4px}
.gcard .summary{font-size:12.5px;color:var(--muted);margin:5px 0 6px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--text);font-weight:400}
.stars{color:var(--accent);letter-spacing:1px;font-size:13px}
.stars .off{opacity:.3}
.badge{font-size:10.5px;padding:1px 6px;border:1px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:2px;white-space:nowrap}
.badge.req{border-color:var(--accent-2);color:var(--accent-2)}
.badge.new{border-color:var(--danger);color:var(--danger);animation:newBlink 1.4s steps(2) infinite}
@keyframes newBlink{50%{opacity:.45}}

/* ---------- おまかせ ---------- */
.roll-stage{
  border:3px solid var(--frame);background:var(--panel);box-shadow:var(--shadow);
  padding:34px 16px;display:grid;place-items:center;gap:16px;text-align:center;margin-bottom:14px;
}
.die{width:76px;height:76px;color:var(--accent)}
.die.shaking{animation:shake .12s steps(2) infinite}
@keyframes shake{0%{transform:translate(-3px,2px) rotate(-4deg)}100%{transform:translate(3px,-2px) rotate(4deg)}}
.encounter{font-size:15px;color:var(--accent);margin:0}
.result-title{font-size:20px;color:var(--accent);margin:0 0 4px}
/* はこ全体が かならず うつる ように、たて長でも よこ長でも ちぢめて おさめる */
.hero-img{width:100%;height:auto;max-height:min(50vh,420px);object-fit:contain;display:block;border:3px solid var(--frame);background:var(--bg-2)}
.hero-fallback{
  width:100%;aspect-ratio:4/3;border:3px solid var(--frame);background:var(--bg-2);
  display:grid;place-items:center;gap:10px;
}
.hero-fallback .glyph{font-size:52px;color:var(--accent)}

/* ---------- 詳細 ---------- */
.detail-title{font-size:22px;line-height:1.45;margin:0 0 14px;color:var(--text)}
.die-face{
  width:52px;height:52px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:2px;padding:7px;border:3px solid var(--frame);background:var(--panel);flex:0 0 auto;
}
.die-face span{display:block}
.die-face span.on{background:var(--accent);border-radius:50%}
.dice-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.score-table{width:100%;border-collapse:collapse}
.score-table th,.score-table td{border:2px solid var(--frame);padding:4px;text-align:center;font-size:13px}
.score-table th{color:var(--accent-2);font-weight:400}
.score-table td.score-cell{
  min-width:54px;padding:9px 4px;font-size:16px;cursor:pointer;
}
.score-table td.score-cell.sel{
  /* えらんで いる マスは わくで しめす（いろを ぬりつぶさない） */
  outline:3px solid var(--accent);outline-offset:-3px;color:var(--accent);
}
.score-table input.score-input{
  width:100%;min-width:52px;padding:6px 4px;border:0;background:transparent;text-align:center;font-size:15px;
}
.score-total td{font-size:16px;color:var(--text)}
/* いちばん てんすうが 高い 人は 数字の 色だけ かえる */
.score-total td.win{color:var(--accent);background:transparent}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--frame);overflow:hidden}
.video-box img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.video-box iframe{width:100%;height:100%;border:0;display:block}
.video-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64px;height:48px;border:3px solid #fff;background:rgba(0,0,0,.6);
  color:#fff;font-size:20px;cursor:pointer;line-height:1;
}
.hero-strip{display:flex;gap:10px;overflow-x:auto;padding:0 0 10px;margin:0 0 14px}
.hero-strip img{height:170px;border:3px solid var(--frame);object-fit:cover;flex:0 0 auto;cursor:zoom-in}
.hero-strip img:active{opacity:.75}
.hero-strip .zoom-hint{
  position:sticky;left:0;align-self:flex-end;color:var(--muted);font-size:11px;padding:0 0 4px;flex:0 0 auto;
}
.section{
  background:var(--panel);border:3px solid var(--frame);box-shadow:var(--shadow);
  padding:14px 15px;margin:0 0 14px;
}
.section > h2{font-size:14px;color:var(--accent);margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--frame)}
.section > h2::before{content:"▼ "}
.section .body{white-space:pre-wrap;font-size:14.5px;line-height:1.9}
.summary-lead{font-size:17px;line-height:1.8;margin:0}
.kv{display:grid;grid-template-columns:7em 1fr;gap:5px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}

/* ---------- フォーム ---------- */
label.lbl{display:block;font-size:13px;margin:0 0 6px;color:var(--accent-2)}
.hint{font-size:11.5px;color:var(--muted);margin-left:6px}
input[type=text],input[type=number],input[type=search],input[type=password],textarea,select{
  width:100%;padding:10px 11px;border:2px solid var(--frame);background:var(--bg-2);
  color:var(--text);outline:none;border-radius:0;-webkit-appearance:none;appearance:none;
}
select{background-image:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input,textarea,select{scroll-margin-top:90px;scroll-margin-bottom:110px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px;
}
textarea{
  min-height:110px;resize:vertical;line-height:1.9;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
}
/* 字が ふえたら たてに のびる らん */
textarea.grow{min-height:0;resize:none;overflow:hidden}
.memo-input{line-height:1.6;padding:9px 10px}
.row{display:flex;gap:9px;align-items:center}
.row > *{flex:1}
.form-group{margin:0 0 16px}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:24px;color:var(--accent);opacity:.28;cursor:pointer;padding:0 2px;line-height:1}
.starpick button[aria-pressed="true"]{opacity:1}
.imgs-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.imgs-preview figure{position:relative;margin:0}
.imgs-preview img{width:72px;height:72px;object-fit:cover;border:2px solid var(--frame)}
.play-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.play-photos img{
  width:108px;height:81px;object-fit:cover;border:2px solid var(--frame);cursor:zoom-in;display:block;
}
.play-photos img:active{opacity:.75}
.play-photos.big{display:block}
.play-photos.big img{width:100%;height:auto;max-height:420px;object-fit:contain;background:var(--bg-2);margin-bottom:8px}
.imgs-preview .x{
  position:absolute;top:-8px;right:-8px;width:22px;height:22px;
  background:var(--danger);color:#fff;border:2px solid var(--frame);font-size:11px;cursor:pointer;line-height:1;padding:0;
}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--muted);padding:10px 14px;cursor:pointer;font-size:13.5px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
details summary{font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0}
details summary::marker{color:var(--accent)}
details[open] summary{margin-bottom:4px}

/* ---------- 管理 ---------- */
.admin-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  background:var(--panel);border:2px solid var(--frame);margin-bottom:8px;
}
.admin-row .t{flex:1;min-width:0}
.admin-row .t b{display:block;font-size:14px;font-weight:400}
.admin-row .t span{font-size:11px;color:var(--muted)}
.mini{border:2px solid var(--frame);background:var(--panel);color:var(--text);padding:5px 9px;font-size:12px;cursor:pointer}
.mini.warn{color:var(--danger);border-color:var(--danger)}
.note{font-size:12.5px;color:var(--muted);border:2px dashed var(--muted);padding:11px 13px;line-height:1.7}
.divider{height:3px;background:var(--frame);opacity:.35;margin:24px 0 18px}
h2.sec{font-size:16px;margin:0 0 10px;color:var(--accent-2)}
h2.sec::before{content:"■ ";font-size:12px}
.tagchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--frame);padding:4px 8px;font-size:12.5px}

.empty{text-align:center;padding:34px 16px;color:var(--muted);border:3px dashed var(--muted)}
.empty .mark{display:block;margin:0 auto 12px;width:40px;height:40px;color:var(--muted)}

/* いんさつ用：がめんの かざりを 消して 紙に おさめる */
@media print{
  .topbar, .tabbar, #bg, #toast, .no-print{display:none !important}
  html, body{background:#fff !important;color:#000 !important;padding:0 !important}
  body{text-shadow:none !important;font-size:10.5pt;line-height:1.45}
  body::after{display:none !important}
  #app{background:#fff !important;max-width:none;padding:0}
  .print-table{width:100%;border-collapse:collapse}
  .print-table th, .print-table td{border:1px solid #999;padding:3px 5px;font-size:9.5pt}
  .print-table th{background:#eee}
  .print-title{font-size:15pt;margin:0 0 6pt}
}
.meter{
  width:100%;height:18px;border:2px solid var(--frame);background:var(--bg-2);
  display:block;overflow:hidden;
}
.meter span{display:block;height:100%;background:var(--accent-2)}
.meter-warn span{background:var(--accent-2)}
.meter-ng span{background:var(--danger)}
.print-table{width:100%;border-collapse:collapse;margin-top:10px}
.print-table th, .print-table td{border:1px solid var(--line, #999);padding:5px 6px;font-size:12px;text-align:left}
.print-table th{color:var(--accent)}

/* ---------- メモ・とうひょう ---------- */
.memo-line{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.memo-input{
  flex:1;min-width:0;padding:9px 10px;border:2px solid var(--frame);background:var(--bg-2);color:var(--text);
}
.memo-line.done .memo-input{
  opacity:.55;text-decoration:line-through;
}
.memo-check{
  flex:0 0 auto;width:30px;height:30px;padding:0;
  border:3px solid var(--frame);background:var(--panel);color:var(--accent);
  font-size:16px;line-height:1;cursor:pointer;
}
.memo-check.on{border-color:var(--accent)}
.vote-pick-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-height:280px;overflow:auto;margin-bottom:10px;padding:2px;
}
@media (max-width:360px){.vote-pick-grid{grid-template-columns:repeat(2,1fr)}}
.vote-pick{
  display:flex;flex-direction:column;gap:4px;padding:5px;
  background:var(--panel);border:3px solid var(--frame);color:var(--text);cursor:pointer;text-align:center;
}
.vote-pick.on{border-color:var(--accent);color:var(--accent)}
.vote-pick:active{transform:translate(1px,1px)}
.vote-pick-name{
  font-size:10.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.thumb.vote-thumb{width:42px;height:42px;min-height:0;flex:0 0 auto}
.thumb.vote-thumb .glyph{font-size:17px}
.vote-row{
  display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:10px 12px;
  background:var(--panel);border:3px solid var(--frame);box-shadow:var(--shadow);
  color:var(--text);text-align:left;cursor:pointer;
}
.vote-row:active{transform:translate(2px,2px);box-shadow:none}
.vote-row.top{border-color:var(--accent);color:var(--accent)}
.vote-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote-bar{
  flex:0 0 72px;height:12px;border:2px solid var(--line-soft);background:var(--bg-2);display:block;
}
.vote-bar span{display:block;height:100%;background:var(--accent-2)}
.vote-row.top .vote-bar span{background:var(--accent)}
.vote-n{flex:0 0 auto;font-size:12px;color:var(--muted);min-width:4em;text-align:right}
.vote-row.top .vote-n{color:var(--accent)}

/* ---------- カレンダー ---------- */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
}
.cal-w{
  text-align:center;font-size:11px;color:var(--muted);padding:4px 0;
}
.cal-cell{
  aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--panel);border:2px solid var(--line-soft);color:var(--muted);
  font-size:12px;padding:0;cursor:default;
}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.has{
  border-color:var(--frame);color:var(--text);cursor:pointer;
}
.cal-cell.has:active{transform:translate(1px,1px)}
.cal-cell.today{border-color:var(--accent-2)}
.cal-d{font-size:13px}
.cal-dot{font-size:7px;color:var(--accent);letter-spacing:-1px;line-height:1}

/* ---------- あみだくじ ---------- */
.amida-wrap{overflow-x:auto;padding:2px 0 6px}
.amida-board{position:relative;margin:0 auto;color:var(--frame)}
.amida-svg{display:block}
.amida-dot{
  position:absolute;transform:translate(-50%,-50%);
  width:34px;height:20px;padding:0;cursor:pointer;
  background:transparent;border:2px dashed var(--line-soft);
}
.amida-dot.on{border-color:transparent;background:transparent}
.amida-dot:active{background:rgba(255,255,255,.15)}
.amida-label{
  position:absolute;transform:translateX(-50%);
  font-size:11.5px;color:var(--text);white-space:nowrap;
  background:var(--panel);border:2px solid var(--frame);padding:2px 6px;max-width:74px;overflow:hidden;text-overflow:ellipsis;
}
.amida-label.head{cursor:pointer}
.amida-label.goal{color:var(--accent-2);border-color:var(--accent-2)}
/* みちすじが うえから したへ のびて いく */
@keyframes amidaDraw{ to{ stroke-dashoffset:0 } }
.amida-path{ animation:amidaDraw var(--amida-time,1.4s) linear forwards }
.amida-head{ filter:drop-shadow(0 0 4px var(--accent)) }
@media (prefers-reduced-motion:reduce){
  .amida-path{animation:none;stroke-dashoffset:0}
  .amida-head{display:none}
}
.amida-label.goal.hidden-goal{color:var(--muted);border-color:var(--muted);letter-spacing:0}
.amida-label.head[disabled]{opacity:.85;cursor:default}
.amida-label.head.opened{border-color:var(--accent);color:var(--accent)}
/* ひらいた しゅんかんに ふだが ひかる */
@keyframes amidaFlash{
  0%{transform:translateX(-50%) scale(1);background:var(--accent);color:var(--panel)}
  60%{transform:translateX(-50%) scale(1.25);background:var(--accent);color:var(--panel)}
  100%{transform:translateX(-50%) scale(1)}
}
.amida-label.goal.flash{animation:amidaFlash .7s steps(6) 1}

/* ---------- どうぐ ---------- */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
/* ---- ぼうけんしゃカード ---- */
.adv{border:3px solid var(--frame);background:var(--panel);box-shadow:var(--shadow);padding:14px}
.adv-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--frame);padding-bottom:6px;margin-bottom:10px;gap:8px}
.adv-name{color:var(--accent);font-size:20px}
.adv-lv{font-size:15px;white-space:nowrap}
.adv-title{border:2px solid var(--accent);padding:6px 9px;margin-bottom:12px}
.adv-title small{display:block;font-size:11px;color:var(--muted)}
.adv-title span{color:var(--accent);font-size:16px}
.adv-exp{height:6px;border:1px solid var(--frame);margin:4px 0 0}
.adv-exp div{height:100%;background:var(--accent)}
.adv-info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-bottom:12px}
.adv-info b{font-weight:400;text-align:right;color:var(--text)}
.adv-info span{color:var(--muted)}
.adv-stats{display:grid;grid-template-columns:auto 1fr 26px;gap:6px 8px;align-items:center;font-size:13px;margin-bottom:6px}
.adv-bar{height:9px;border:1px solid var(--frame);background:var(--bg-2)}
.adv-bar div{height:100%;background:var(--accent-2)}
.adv-bar.top div{background:var(--accent)}
.adv-stats .v{text-align:right;font-size:12px}
.adv-badges{display:flex;flex-wrap:wrap;gap:6px}
.adv-badge{border:2px solid var(--accent);color:var(--accent);padding:2px 7px;font-size:12px}
.adv-badge.locked{border-color:var(--muted);color:var(--muted)}
/* ---- ちょうぼ・うわさばなし ---- */
.cb-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--frame);background:var(--panel);margin-bottom:6px;font-size:13px}
.cb-row .t{flex:1;min-width:0}
.cb-res{font-size:15px;margin:0 0 6px}
.talk-card{border:3px solid var(--accent);background:var(--bg-2);box-shadow:var(--shadow);padding:22px 16px;text-align:center;margin-bottom:12px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.talk-card .cat{font-size:11px;color:var(--muted);margin:0 0 8px}
.talk-card .q{font-size:19px;line-height:1.6;margin:0;color:var(--text)}
.talk-card .who{font-size:13px;color:var(--accent);margin:12px 0 0}
/* ---- ジュークボックス ---- */
.jb-top{
  text-align:center;padding:14px 12px 12px;margin-bottom:12px;
  border:3px solid var(--accent);background:var(--bg-2);box-shadow:var(--shadow);
}
.jb-eq{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:34px;margin-bottom:8px}
.jb-eq span{width:8px;height:6px;background:var(--accent-2)}
.jukebox.playing .jb-eq span{animation:jbEq .9s steps(4) infinite}
.jukebox.playing .jb-eq span:nth-child(2){animation-delay:-.3s;background:var(--accent)}
.jukebox.playing .jb-eq span:nth-child(3){animation-delay:-.6s}
.jukebox.playing .jb-eq span:nth-child(4){animation-delay:-.15s;background:var(--accent)}
.jukebox.playing .jb-eq span:nth-child(5){animation-delay:-.45s}
.jukebox.playing .jb-eq span:nth-child(6){animation-delay:-.75s;background:var(--accent)}
.jukebox.playing .jb-eq span:nth-child(7){animation-delay:-.2s}
@keyframes jbEq{0%{height:6px}25%{height:30px}50%{height:14px}75%{height:24px}100%{height:6px}}
.jb-state{margin:0 0 4px;font-size:12px;color:var(--accent-2)}
.jukebox.playing .jb-state{color:var(--accent)}
.jb-name{margin:0 0 2px;font-size:18px;color:var(--text);line-height:1.4}
.jb-no{margin:0 0 10px;font-size:11px;color:var(--muted)}
.jb-progress{height:8px;border:2px solid var(--frame);background:var(--panel);margin:0 0 6px}
.jb-progress div{height:100%;width:0;background:var(--accent)}
.jb-time{margin:0;font-size:12px;color:var(--muted)}
.jb-ctrl .btn{flex:1}
.jb-list{display:flex;flex-direction:column;gap:6px}
.jb-track{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  padding:9px 10px;background:var(--panel);border:2px solid var(--frame);color:var(--text);font:inherit;font-size:14px;
}
.jb-track .jb-tno{flex:0 0 auto;color:var(--muted);font-size:12px}
.jb-track .jb-tname{flex:1;min-width:0}
.jb-track .jb-tmark{flex:0 0 auto;visibility:hidden;color:var(--accent)}
.jb-track.now{border-color:var(--accent)}
.jb-track.now .jb-tname{color:var(--accent)}
.jb-track.now .jb-tmark{visibility:visible}
.jukebox.playing .jb-track.now .jb-tmark{animation:jbBlink 1s steps(2) infinite}
@keyframes jbBlink{50%{opacity:0}}
.tool-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;
  background:var(--panel);border:3px solid var(--frame);box-shadow:var(--shadow);
  color:var(--text);cursor:pointer;text-align:center;
}
.tool-card:active{transform:translate(2px,2px);box-shadow:none}

function pixSVG(name){
  const map = ICONS[name];
  if(!map) return '';
  let rects = '';
  map.forEach((row, y) => {
    for(let x = 0; x < row.length; x++){
      if(row[x] === '#') rects += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
    }
  });
  return '<svg viewBox="0 0 8 8" width="100%" height="100%" fill="currentColor" ' +
    'shape-rendering="crispEdges" aria-hidden="true">' + rects + '</svg>';
}
function paintIcons(root){
  (root || document).querySelectorAll('[data-icon]').forEach(el => {
    if(!el.dataset.painted){ el.innerHTML = pixSVG(el.dataset.icon); el.dataset.painted = '1'; }
  });
}

const store = {
  read(k, fallback){
    try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  write(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ toast('セーブできませんでした（画像が多すぎるかも）'); return false; }
  }
};

const sound = {
  bgm: null, click: null, fanfare: null, timerSe: null, diceSe: null,
  hitSe: null, missSe: null, stepSe: null,
  unlocked: false,
  bgmOn: store.read(KEY.bgm, true),   /* BGM の ON/OFF */
  seOn:  store.read(KEY.se,  true),   /* こうかおんの ON/OFF（べつべつに きりかえ） */
  trackId: store.read(KEY.bgmTrack, BGM_TRACKS[0].id),
  mode: store.read(KEY.bgmMode, 'one'),
  volume: Math.min(1, Math.max(0, Number(store.read(KEY.bgmVol, 0.45)))),
  bgmError: false
};
function currentTrack(){
  return BGM_TRACKS.find(t => t.id === sound.trackId) || BGM_TRACKS[0];
}
/* iPhone は「画面を さわった 直後」でないと おとを ならせない しくみが あり、
   ふつうの Audio では 数びょう たつと なりません。
   Web Audio に よみこんで おくと、なんぷん あとでも かくじつに ならせます。 */
let audioCtx = null;
const buffers = {};      /* click / fanfare / timer の おとの データ */

function b64ToArrayBuffer(dataUri){
  const b64 = String(dataUri).split(',')[1] || '';
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function prepareBuffers(){
  if(!audioCtx) return;
  [['click', AUDIO.click], ['fanfare', AUDIO.fanfare], ['timer', AUDIO.timer], ['dice', AUDIO.dice],
   ['hit', AUDIO.hit], ['miss', AUDIO.miss], ['step', AUDIO.step]].forEach(pair => {
    const key = pair[0], src = pair[1];
    if(buffers[key] || !src) return;
    try{
      audioCtx.decodeAudioData(b64ToArrayBuffer(src),
        buf => { buffers[key] = buf; },
        () => {});
    }catch(e){ /* つかえない ブラウザでは ふつうの Audio を つかう */ }
  });
}
function playBuffer(key, volume){
  if(!audioCtx || !buffers[key]) return false;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  try{
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    gain.gain.value = (volume === undefined ? 0.9 : volume);
    src.buffer = buffers[key];
    src.connect(gain).connect(audioCtx.destination);
    src.start(0);
    return true;
  }catch(e){ return false; }
}

/* ---------------- BGMの プレーヤー ----------------
   iPhone では ふつうの Audio の「おおきさ」が かえられず、
   くりかえしの つなぎめにも すきまが できる。
   そこで きょくを Web Audio に よみこみ、
   ・おおきさ（ゲイン）を じぶんで かける
   ・はじめと おわりの むおんを けずる
   ・おわりの よいん（リバーブ）に かさねて つぎの 1しゅうめを はじめる
   ことで、どの きょくも なめらかに くりかえす。
   Web Audio が つかえない とき（file:// で ひらいた ときなど）は ふつうの Audio に もどる。
   ふつうの Audio と おなじ つかいかた（play/pause/src/loop/volume/currentTime…）が できる。 */
class BgmPlayer{
  constructor(){
    this._src = ''; this._loop = true; this._vol = 0.45;
    this.paused = true; this._want = false;
    this._buf = null; this._bufSrc = ''; this._loading = null;
    this._nodes = [];            /* ならして いる おと（かさなる ことが ある） */
    this._seg = null;            /* いまの 1しゅう {at: ならしはじめた じこく, from: きょくの どこから} */
    this._next = 0;              /* つぎの 1しゅうを はじめる じこく */
    this._pos = 0;               /* とめた ときの いち */
    this._tick = null;
    this._ev = {};
    this._el = null;             /* ふつうの Audio（よび） */
    this._fallback = false;
  }
  addEventListener(t, f){ (this._ev[t] = this._ev[t] || []).push(f); }
  _emit(t){ (this._ev[t] || []).forEach(f => { try{ f(); }catch(e){} }); }
  _ctxOk(){ return !!audioCtx && !this._fallback && /^https?:$/.test(location.protocol); }

  /* ---- ふつうの Audio（よび） ---- */
  _useEl(){
    if(this._el) return this._el;
    const el = new Audio();
    el.preload = 'none';
    ['play','pause','loadedmetadata','timeupdate','error'].forEach(t => el.addEventListener(t, () => {
      if(t === 'play') this.paused = false;
      if(t === 'pause') this.paused = true;
      this._emit(t);
    }));
    el.addEventListener('ended', () => { this.paused = true; this._emit('ended'); });
    el.loop = this._loop; el.volume = this._vol; el.src = this._src;
    this._el = el;
    return el;
  }

  get src(){ return this._src; }
  set src(v){
    this.pause();
    this._src = v; this._pos = 0;
    if(this._bufSrc !== v){ this._buf = null; this._bufSrc = ''; this._loading = null; }
    if(this._el){ this._el.src = v; }
  }
  load(){ if(this._el && this._fallback) this._el.load(); }
  get loop(){ return this._loop; }
  set loop(v){
    v = !!v;
    if(v === this._loop) return;
    this._loop = v;
    if(this._el) this._el.loop = v;
    /* ながして いる とちゅうなら、いまの いちから かけなおす */
    if(!this.paused && !this._fallback && this._buf){ const at = this.currentTime; this._stopNodes(); this._startAt(at); }
  }
  get volume(){ return this._vol; }
  set volume(v){
    this._vol = Math.min(1, Math.max(0, v));
    if(this._el) this._el.volume = this._vol;
    if(this._gain && audioCtx) this._gain.gain.setTargetAtTime(this._vol, audioCtx.currentTime, 0.05);
  }
  get duration(){
    if(this._fallback) return this._el ? this._el.duration : NaN;
    return this._buf ? this._buf.duration : NaN;
  }
  get currentTime(){
    if(this._fallback) return this._el ? this._el.currentTime : 0;
    if(this.paused || !this._seg || !audioCtx) return this._pos;
    const t = this._seg.from + (audioCtx.currentTime - this._seg.at);
    return Math.max(0, Math.min(t, this.duration || t));
  }
  set currentTime(v){
    if(this._fallback){ if(this._el) this._el.currentTime = v; return; }
    if(this.paused){ this._pos = v; return; }
    this._stopNodes(); this._startAt(v);
  }

  /* ---- よみこみ ---- */
  _fetch(){
    if(this._buf && this._bufSrc === this._src) return Promise.resolve(this._buf);
    if(this._loading) return this._loading;
    const want = this._src;
    this._loading = fetch(want).then(r => {
      if(!r.ok) throw new Error('notfound');
      return r.arrayBuffer();
    }).then(ab => new Promise((ok, ng) => {
      /* ふるい Safari は コールバック しか つかえない */
      const pr = audioCtx.decodeAudioData(ab, ok, ng);
      if(pr && pr.then) pr.then(ok, ng);
    })).then(buf => {
      if(this._src !== want) return null;       /* とちゅうで きょくが かわった */
      this._buf = buf; this._bufSrc = want;
      this._measure(buf);
      this._emit('loadedmetadata');
      return buf;
    });
    this._loading.catch(err => {
      this._loading = null;
      if(this._src !== want) return;
      if(err && err.message === 'notfound'){ this._emit('error'); return; }
      /* fetch が つかえない ばしょ → ふつうの Audio に きりかえ */
      this._fallback = true;
      if(this._want){ const el = this._useEl(); el.src = this._src; el.play().catch(() => {}); }
    });
    return this._loading;
  }
  /* はじめと おわりの むおん、おわりの よいんの ながさを しらべる */
  _measure(buf){
    const sr = buf.sampleRate, n = buf.length;
    const chs = []; for(let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c));
    const amp = i => { let m = 0; for(const d of chs){ const v = Math.abs(d[i]); if(v > m) m = v; } return m; };
    const TH = 0.0015;                               /* だいたい -56dB */
    let a = 0; while(a < n && amp(a) < TH) a++;
    let b = n - 1; while(b > a && amp(b) < TH) b--;
    if(b - a < sr) { a = 0; b = n - 1; }             /* みじかすぎる ときは そのまま */
    /* よいん：おわりから みて、おとが おおきかった さいごの ところ（-30dB） */
    const win = Math.floor(sr * 0.05);
    let tail = b;
    const rms = (i0) => { let s = 0, k = 0; for(let i = i0; i < i0 + win && i < n; i += 4){ const v = amp(i); s += v*v; k++; } return Math.sqrt(s / Math.max(1,k)); };
    for(let i = b - win; i > a + sr; i -= win){ if(rms(i) > 0.03){ tail = i + win; break; } }
    let over = Math.min(2.5, Math.max(0, (b - tail) / sr));
    if(over < 0.08) over = 0;                        /* よいんが ない きょくは ぴったり つなぐ */
    this._a = a / sr;                                /* 1しゅうの はじまり */
    this._b = (b + 1) / sr;                          /* おとの おわり */
    this._over = over;                               /* つぎと かさねる ながさ */
  }

  /* ---- ならす ---- */
  _master(){
    if(!this._gain){
      this._gain = audioCtx.createGain();
      this._gain.gain.value = this._vol;
      this._gain.connect(audioCtx.destination);
    }
    return this._gain;
  }
  _voice(at, from, fadeIn){
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    src.buffer = this._buf;
    src.connect(g).connect(this._master());
    if(fadeIn){ g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(1, at + fadeIn); }
    src.start(at, Math.max(0, from));
    const node = {src, g};
    this._nodes.push(node);
    src.onended = () => {
      this._nodes = this._nodes.filter(x => x !== node);
      /* くりかえさない ときは、さいごの おとが おわったら「おわり」 */
      if(!this._loop && !this.paused && !this._nodes.length){
        this.paused = true; this._pos = 0; this._seg = null;
        this._stopTick(); this._emit('pause'); this._emit('ended');
      }
    };
    return node;
  }
  _startAt(pos){
    const now = audioCtx.currentTime + 0.03;
    if(pos >= this._b - 0.05) pos = this._a;
    const from = Math.max(pos, 0);
    this._voice(now, from, from > this._a + 0.01 ? 0.03 : 0);
    this._seg = {at: now, from: from};
    this._next = now + (this._b - this._over - from);
    this._startTick();
  }
  _schedule(){
    if(this.paused || !this._loop || !this._buf) return;
    /* つぎの 1しゅうを 1びょう まえに よやく する */
    while(this._next - audioCtx.currentTime < 1.2){
      const at = Math.max(this._next, audioCtx.currentTime + 0.02);
      this._voice(at, this._a, 0);
      const seg = {at: at, from: this._a};
      /* 1しゅうめが はじまったら いちの けいさんを きりかえる */
      const wait = Math.max(0, (at - audioCtx.currentTime) * 1000);
      const gen = this._gen;
      setTimeout(() => { if(!this.paused && gen === this._gen) this._seg = seg; }, wait);
      this._next = at + (this._b - this._over - this._a);
    }
  }
  _startTick(){
    this._stopTick();
    this._tick = setInterval(() => { this._schedule(); this._emit('timeupdate'); }, 250);
    this._schedule();
  }
  _stopTick(){ if(this._tick){ clearInterval(this._tick); this._tick = null; } }
  _stopNodes(){
    this._gen = (this._gen || 0) + 1;
    const t = audioCtx ? audioCtx.currentTime : 0;
    this._nodes.forEach(n => {
      n.src.onended = null;
      try{ n.g.gain.setTargetAtTime(0.0001, t, 0.015); n.src.stop(t + 0.08); }catch(e){}
    });
    this._nodes = [];
    this._stopTick();
  }
  play(){
    this._want = true;
    if(!this._ctxOk()){
      const el = this._useEl();
      if(el.src !== new URL(this._src, location.href).href) el.src = this._src;
      return el.play();
    }
    if(audioCtx.state !== 'running' && audioCtx.resume) audioCtx.resume();
    if(!this.paused) return Promise.resolve();
    return this._fetch().then(buf => {
      if(!buf || !this._want || !this.paused) return;
      this.paused = false;
      this._startAt(this._pos || this._a);
      this._emit('play');
    });
  }
  pause(){
    this._want = false;
    if(this._el && !this._el.paused) this._el.pause();
    if(this.paused) return;
    this._pos = this.currentTime;
    this._stopNodes();
    this.paused = true; this._seg = null;
    this._emit('pause');
  }
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && audioCtx && audioCtx.state !== 'running' && sound.bgmOn){
    try{ audioCtx.resume(); }catch(e){}
  }
});

function initAudio(){
  sound.bgm = new BgmPlayer();
  sound.bgm.loop = (sound.mode === 'one');
  sound.bgm.volume = sound.volume;
  sound.bgm.src = currentTrack().file;    /* ならす まで よみこまない（つうしんの せつやく） */
  /* 1きょく おわったら つぎへ（くりかえし いがい） */
  sound.bgm.addEventListener('ended', () => {
    if(sound.mode === 'one') return;
    jukeStep(1);
  });
  ['play','pause','loadedmetadata'].forEach(ev => sound.bgm.addEventListener(ev, paintJukebox));
  sound.bgm.addEventListener('timeupdate', paintJukeTime);
  sound.bgm.addEventListener('error', () => {
    sound.bgmError = true;
    const jn = document.getElementById('jbNote');
    if(jn) jn.textContent = 'きょくの ファイルが みつかりません（' + currentTrack().file + '）。index.html と おなじ ばしょに アップロード して ください。';
    const el = document.getElementById('bgmNote');
    if(el) el.textContent = 'きょくの ファイルが みつかりません。index.html と おなじ ばしょに mp3 を アップロード して ください。';
  });

  sound.click = new Audio(AUDIO.click);
  sound.click.volume = 0.6;

  sound.fanfare = new Audio(AUDIO.fanfare);
  sound.fanfare.volume = 0.85;
  sound.fanfare.preload = 'auto';

  sound.timerSe = new Audio(AUDIO.timer);      /* タイマー しゅうりょうの おと */
  sound.timerSe.volume = 0.9;
  sound.timerSe.preload = 'auto';

  sound.diceSe = new Audio(AUDIO.dice);        /* サイコロの めが きまった おと */
  sound.diceSe.volume = 0.85;
  sound.diceSe.preload = 'auto';

  sound.hitSe = new Audio(AUDIO.hit);          /* あたり */
  sound.hitSe.volume = 0.9;
  sound.missSe = new Audio(AUDIO.miss);        /* はずれ */
  sound.missSe.volume = 0.7;
  sound.stepSe = new Audio(AUDIO.step);        /* 線が すすむ おと */
  sound.stepSe.volume = 0.35;
}
function unlockAudioOnce(){
  if(sound.unlocked) return;
  sound.unlocked = true;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx){
      audioCtx = new Ctx();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      /* むおんを 1つ ならして iPhone の ロックを はずす */
      const s0 = audioCtx.createBufferSource();
      s0.buffer = audioCtx.createBuffer(1, 1, 22050);
      s0.connect(audioCtx.destination);
      s0.start(0);
      prepareBuffers();
    }
  }catch(e){ /* つかえなければ ふつうの Audio のまま */ }
  syncBgm();
  document.removeEventListener('pointerdown', unlockAudioOnce);
}
/* BGM は どの がめんでも ずっと ながれる（ついか・へんしゅう・かんり ふくむ） */
function syncBgm(){
  if(!sound.bgm) return;
  if(sound.bgmOn && sound.unlocked){
    if(sound.bgm.paused){ const p = sound.bgm.play(); if(p && p.catch) p.catch(()=>{}); }
  }else{
    if(!sound.bgm.paused) sound.bgm.pause();
  }
}
function playClick(){
  if(!sound.seOn) return;
  if(playBuffer('click', 0.6)) return;
  if(!sound.click) return;
  const n = sound.click.cloneNode();
  n.volume = sound.click.volume;
  n.play().catch(()=>{});
}
function playTimerSe(){
  if(!sound.seOn) return;
  const once = () => {
    if(playBuffer('timer', 0.9)) return;
    if(!sound.timerSe) return;
    const n = sound.timerSe.cloneNode();
    n.volume = sound.timerSe.volume;
    n.play().catch(()=>{});
  };
  once();
  setTimeout(once, 850);   /* きこえやすい ように 2かい */
}
function playDiceSe(){
  if(!sound.seOn) return;
  if(playBuffer('dice', 0.85)) return;
  if(!sound.diceSe) return;
  const n = sound.diceSe.cloneNode();
  n.volume = sound.diceSe.volume;
  n.play().catch(()=>{});
}
function playHitSe(){
  if(!sound.seOn) return;
  if(playBuffer('hit', 0.9)) return;
  if(sound.hitSe){ const n = sound.hitSe.cloneNode(); n.volume = 0.9; n.play().catch(()=>{}); }
}
function playMissSe(){
  if(!sound.seOn) return;
  if(playBuffer('miss', 0.7)) return;
  if(sound.missSe){ const n = sound.missSe.cloneNode(); n.volume = 0.7; n.play().catch(()=>{}); }
}
function playStepSe(){
  if(!sound.seOn) return;
  if(playBuffer('step', 0.3)) return;
  if(sound.stepSe){ const n = sound.stepSe.cloneNode(); n.volume = 0.3; n.play().catch(()=>{}); }
}

function playJobSe(){
  if(!sound.seOn) return;
  const key = 'job_hero', src = JOB_SE.hero;
  const plain = () => { try{ const a = new Audio(src); a.volume = 0.9; a.play().catch(()=>{}); }catch(e){} };
  if(audioCtx){
    if(buffers[key]){ playBuffer(key, 0.9); return; }
    try{
      audioCtx.decodeAudioData(b64ToArrayBuffer(src),
        buf => { buffers[key] = buf; playBuffer(key, 0.9); },
        () => plain());
      return;
    }catch(e){}
  }
  plain();
}
function playFanfare(){
  if(!sound.seOn) return;
  if(playBuffer('fanfare', 0.85)) return;
  if(!sound.fanfare) return;
  const n = sound.fanfare.cloneNode();
  n.volume = sound.fanfare.volume;
  n.play().catch(()=>{});
}
function paintFriendDot(){
  const d = document.getElementById('friendDot');
  if(!d) return;
  d.hidden = !(isOnline() && state.friends && (state.friends.incoming || []).length);
}
function paintDirtyDot(){
  const d = document.getElementById('dirtyDot');
  if(!d) return;
  /* サイトに つないで いない 人（こうかい設定 なし）には 出さない */
  const cfg = getSiteConfig();
  const show = isDirty() && !!(cfg.owner && cfg.repo && cfg.token);
  d.hidden = !show;
}
function paintSoundBtns(){
  const b = document.getElementById('bgmBtn');
  if(b){
    b.textContent = '♪';
    b.classList.toggle('off', !sound.bgmOn);
    b.setAttribute('aria-pressed', String(sound.bgmOn));
    b.setAttribute('aria-label', 'BGM ' + (sound.bgmOn ? 'ON' : 'OFF'));
  }
  const e = document.getElementById('seBtn');
  if(e){
    e.textContent = 'SE';
    e.classList.toggle('off', !sound.seOn);
    e.setAttribute('aria-pressed', String(sound.seOn));
    e.setAttribute('aria-label', 'こうかおん ' + (sound.seOn ? 'ON' : 'OFF'));
  }
  const bc = document.getElementById('bgmChk');
  if(bc) bc.checked = sound.bgmOn;
  const sc = document.getElementById('seChk');
  if(sc) sc.checked = sound.seOn;
  document.querySelectorAll('[data-track]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.track === sound.trackId));
  });
  paintJukebox();
}
function setBgmTrack(id){
  const t = BGM_TRACKS.find(x => x.id === id);
  if(!t) return;
  sound.trackId = t.id;
  sound.bgmError = false;
  store.write(KEY.bgmTrack, t.id);
  const wasPlaying = sound.bgm && !sound.bgm.paused;
  if(sound.bgm){
    sound.bgm.pause();
    sound.bgm.src = t.file;
    sound.bgm.load();
  }
  paintSoundBtns();
  if(sound.bgmOn && sound.unlocked || wasPlaying) syncBgm();
}
function setBgmOn(v){
  sound.bgmOn = v; store.write(KEY.bgm, v);
  paintSoundBtns(); syncBgm();
}
function setSeOn(v){
  sound.seOn = v; store.write(KEY.se, v);
  paintSoundBtns();
}

/* ---------------- ジュークボックス ----------------
   さかばの すみに ある ジュークボックス。
   きょくを えらぶ・とめる・つぎへ・ながしかた・おおきさ を ここで きめる。 */
function jukeIndex(){ return Math.max(0, BGM_TRACKS.findIndex(t => t.id === sound.trackId)); }
function jukeStep(d){
  let i;
  if(sound.mode === 'shuffle' && BGM_TRACKS.length > 1){
    do{ i = Math.floor(Math.random() * BGM_TRACKS.length); }while(i === jukeIndex());
  }else{
    i = (jukeIndex() + d + BGM_TRACKS.length) % BGM_TRACKS.length;
  }
  setBgmTrack(BGM_TRACKS[i].id);
  if(!sound.bgmOn) setBgmOn(true);
}
function setBgmMode(m){
  sound.mode = m; store.write(KEY.bgmMode, m);
  if(sound.bgm) sound.bgm.loop = (m === 'one');
  paintJukebox();
}
function setBgmVolume(v){
  sound.volume = Math.min(1, Math.max(0, v));
  store.write(KEY.bgmVol, sound.volume);
  if(sound.bgm) sound.bgm.volume = sound.volume;
}
function isBgmPlaying(){ return !!(sound.bgm && !sound.bgm.paused && sound.bgmOn); }
function mmss(sec){
  if(!isFinite(sec) || sec < 0) return '--:--';
  sec = Math.floor(sec);
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function paintJukeTime(){
  const t = document.getElementById('jbTime');
  if(!t || !sound.bgm) return;
  const cur = sound.bgm.currentTime || 0, dur = sound.bgm.duration;
  t.textContent = mmss(cur) + ' / ' + mmss(dur);
  const bar = document.getElementById('jbBar');
  if(bar) bar.style.width = (isFinite(dur) && dur > 0 ? Math.min(100, cur/dur*100) : 0) + '%';
}
function paintJukebox(){
  const box = document.getElementById('jukebox');
  if(!box) return;
  const playing = isBgmPlaying();
  box.classList.toggle('playing', playing);
  const nm = document.getElementById('jbName');
  if(nm) nm.textContent = currentTrack().name;
  const no = document.getElementById('jbNo');
  if(no) no.textContent = 'No.' + String(jukeIndex()+1).padStart(2,'0') + ' / ' + String(BGM_TRACKS.length).padStart(2,'0');
  const st = document.getElementById('jbState');
  if(st) st.textContent = playing ? '♪ NOW PLAYING' : (sound.bgmOn ? '… よみこみ中' : '■ とまって います');
  const pb = document.getElementById('jbPlay');
  if(pb) pb.textContent = playing ? '❚❚ とめる' : '▶ ならす';
  document.querySelectorAll('[data-jbtrack]').forEach(b => {
    const on = b.dataset.jbtrack === sound.trackId;
    b.setAttribute('aria-current', String(on));
    b.classList.toggle('now', on);
  });
  document.querySelectorAll('[data-jbmode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.jbmode === sound.mode)));
  paintJukeTime();
}

  return '<div id="jukebox" class="jukebox">' +
    '<div class="jb-top">' +
      '<div class="jb-eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>' +

      '<p class="jb-name" id="jbName"></p>' +

    '</div>' +
    '<div class="btn-row jb-ctrl">' +

function bindJukebox(){
  const box = document.getElementById('jukebox');
  if(!box) return;
  const p = document.getElementById('jbPlay');
  if(p) p.onclick = () => {
    if(isBgmPlaying()){ setBgmOn(false); }
    else{ sound.bgmError = false; setBgmOn(true); }
    paintJukebox();
  };
  const pv = document.getElementById('jbPrev');
  if(pv) pv.onclick = () => jukeStep(-1);
  const nx = document.getElementById('jbNext');
  if(nx) nx.onclick = () => jukeStep(1);
  box.querySelectorAll('[data-jbmode]').forEach(b => b.onclick = () => setBgmMode(b.dataset.jbmode));
  box.querySelectorAll('[data-jbtrack]').forEach(b => b.onclick = () => {
    if(b.dataset.jbtrack === sound.trackId && isBgmPlaying()) return;
    setBgmTrack(b.dataset.jbtrack);
    if(!sound.bgmOn) setBgmOn(true);
    paintJukebox();
  });
  const v = document.getElementById('jbVol');
  if(v) v.oninput = () => setBgmVolume(Number(v.value)/100);
  paintJukebox();
}

/* この端末で へんしゅう した しるし。
   これが ついて いる あいだは、サイト側の データで かってに 上書き しない。 */
function markDirty(){ store.write(KEY.dirty, true); }
/* ずかんの ないよう（あそんだ きろく・かしだしを のぞく）の しるし */
function libSig(games, tags){
  const strip = (games || []).map(g => {
    const c = Object.assign({}, g);
    ['plays', 'lentTo', 'lentDate'].forEach(f => { delete c[f]; });
    return c;
  });
  const str = JSON.stringify([strip, tags || []]);
  let h1 = 0x811c9dc5, h2 = 5381;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = (Math.imul(h2, 33) + c) >>> 0;
  }
  return str.length + ':' + h1.toString(36) + h2.toString(36);
}
function curSig(){ return libSig(state.games, state.tags); }
function clearDirty(){ store.write(KEY.dirty, false); store.write(KEY.pubsig, curSig()); }
function isDirty(){
  const sig = store.read(KEY.pubsig, '');
  if(!sig) return store.read(KEY.dirty, false);   /* まだ しるしが ない ふるい 端末 */
  return sig !== curSig();
}
function isPublisher(){
  const c = getSiteConfig();
  return !!(c.owner && c.repo && c.token);
}

function saveGames(){ store.write(KEY.games, state.games); markDirty(); }
function saveTags(){ store.write(KEY.tags, state.tags); markDirty(); }

function keepBeforeAdopt(){
  try{ if(localStorage.getItem(KEY.games) == null) return; }catch(e){ return; }   /* はじめての 人は ひかえ いらない */
  try{ store.write(KEY.preAdopt, {at:Date.now(), games:state.games, tags:state.tags, pubver:store.read(KEY.pubver, '')}); }
  catch(e){}
}
function adoptSiteData(data){
  state.games = mergePrivate(data.games);
  if(Array.isArray(data.tags) && data.tags.length) state.tags = data.tags;
  store.write(KEY.games, state.games);
  store.write(KEY.tags, state.tags);
  store.write(KEY.pubver, String(data.version || ''));
  clearDirty();                 /* サイトと おなじ ないよう なので しるしを けす */
  pendingSiteData = null;
  render();
}

async function fetchSiteLibrary(){
  const res = await fetch('library.json?t=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  if(!data || !Array.isArray(data.games)) throw new Error('format');
  siteInfo = {version:String(data.version || ''), games:data.games, tags:data.tags, at:Date.now()};
  return data;
}
async function syncPublished(){
  if(location.protocol === 'file:') return;
  let data;
  try{ data = await fetchSiteLibrary(); }
  catch(e){ return; }   /* library.json が無ければ 何も しない */
  const inAdmin = () => currentRoute().name === 'admin';
  const ver = String(data.version || '');
  const siteSig = libSig(data.games, data.tags);

  /* もう おなじ ないよう なら、しるしを そろえる だけ */
  if(siteSig === curSig()){
    store.write(KEY.pubver, ver);
    clearDirty();
    pendingSiteData = null;
    if(inAdmin()) render();
    return;
  }
  if(store.read(KEY.localOnly, false)){ if(inAdmin()) render(); return; }
  if(ver && ver === store.read(KEY.pubver, '')){ if(inAdmin()) render(); return; }

  /* サイトを こうしん できる 端末（かんりにん）で、まだ だして いない へんしゅうが ある ときは
     上書き しない。かんり画面で えらべる ように して おく。 */
  if(isPublisher() && isDirty()){
    pendingSiteData = data;
    if(inAdmin()) render();
    return;
  }
  /* それ いがいの 端末は、サイトの あたらしい ずかんに そろえる（まえの ないようは ひかえに のこす） */
  const before = state.games.length;
  keepBeforeAdopt();
  adoptSiteData(data);
  if(before !== state.games.length) toast('ずかんを さいしんに しました（' + state.games.length + 'さくひん）');
}
/* アプリに もどって きた ときも サイトを みに いく（ホーム画面の アプリは よみこみ なおさない ため） */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  const t = Date.now();
  if(t - (syncPublished._last || 0) < 60000) return;
  syncPublished._last = t;
  syncPublished();
});

let lbImages = [], lbIndex = 0;

function openLightbox(images, index){
  lbImages = (images || []).filter(Boolean);
  if(!lbImages.length) return;
  lbIndex = Math.max(0, Math.min(lbImages.length - 1, Number(index) || 0));
  const back = document.getElementById('lightbox');
  if(!back) return;
  back.hidden = false;
  paintLightbox();
}
function paintLightbox(){
  const img = document.getElementById('lbImg');
  const cnt = document.getElementById('lbCount');
  const prev = document.getElementById('lbPrev');
  const next = document.getElementById('lbNext');
  const hint = document.getElementById('lbHint');
  if(!img) return;
  img.src = lbImages[lbIndex] || '';
  const many = lbImages.length > 1;
  if(cnt) cnt.textContent = many ? (lbIndex + 1) + ' / ' + lbImages.length + 'まい' : '';
  if(prev) prev.hidden = !many;
  if(next) next.hidden = !many;
  const foot = document.querySelector('.lb-foot');
  if(foot) foot.style.display = many ? 'flex' : 'none';
  if(hint) hint.textContent = many
    ? 'よこに スワイプ、または 下の ◀▶ で つぎの しゃしんへ。'
    : 'しゃしんの そとを タップすると とじます。2ほんゆびで もっと 大きく できます。';
}
function closeLightbox(){
  const back = document.getElementById('lightbox');
  if(back) back.hidden = true;
  const img = document.getElementById('lbImg');
  if(img) img.src = '';
}
function stepLightbox(d){
  if(!lbImages.length) return;
  lbIndex = (lbIndex + d + lbImages.length) % lbImages.length;
  paintLightbox();
}

/* はい／いいえ を きく ウィンドウ。
   こたえが かえって きたら つづきを する（confirm の かわり）。 */
function ask(msg, onYes, opts){
  const back = document.getElementById('dialog');
  const text = document.getElementById('dialogMsg');
  const yes = document.getElementById('dialogYes');
  const no  = document.getElementById('dialogNo');
  if(!back || !text) { if(onYes) onYes(); return; }

  text.textContent = msg;
  yes.textContent = (opts && opts.yes) || 'はい';
  no.textContent  = (opts && opts.no)  || 'いいえ';
  back.hidden = false;

  const close = () => {
    back.hidden = true;
    yes.onclick = null; no.onclick = null; back.onclick = null;
  };
  yes.onclick = () => { close(); if(onYes) onYes(); };
  no.onclick = () => { close(); if(opts && opts.onNo) opts.onNo(); };
  back.onclick = e => {
    if(e.target !== back) return;
    close();
    if(opts && opts.onBack) opts.onBack();
    else if(opts && opts.onNo) opts.onNo();
  };
}

/* もじを いれて もらう ウィンドウ */
function askText(label, now, onOk){
  const back = document.getElementById('dialog');
  const text = document.getElementById('dialogMsg');
  const yes = document.getElementById('dialogYes');
  const no  = document.getElementById('dialogNo');
  if(!back) return;

  text.innerHTML = esc(label) +
    '<input type="text" id="dialogText" value="'+esc(now||'')+'" style="margin-top:10px">';
  yes.textContent = 'これに する';
  no.textContent = 'やめる';
  back.hidden = false;
  setTimeout(() => {
    const f = document.getElementById('dialogText');
    if(f){ f.focus(); f.select(); }
  }, 60);

  const close = () => { back.hidden = true; yes.onclick = null; no.onclick = null; back.onclick = null; text.textContent = ''; };
  yes.onclick = () => {
    const v = (document.getElementById('dialogText')||{value:''}).value.trim();
    close(); if(v && onOk) onOk(v);
  };
  no.onclick = close;
  back.onclick = e => { if(e.target === back) close(); };
}

/* ---------------- ボードゲーム会の たな ----------------
   もっていく ゲームを えらんで おくと、かいの あいだは
   「さがす」「ずかん」「おまかせ」「とうひょう」が その ゲームだけに なる。
   ともだちには リンク（?kai=...）で おなじ たなを みせられる。 */
function saveKai(){ store.write(KEY.kai, state.kai); }
function kaiName(){ return (state.kai.name || '').trim() || 'ボードゲーム会'; }
function kaiHas(id){ return state.kai.ids.includes(id); }
function kaiGames(){
  const set = new Set(state.kai.ids);
  return ownedGames().filter(g => set.has(g.id)).sort((a,b) => a.title.localeCompare(b.title,'ja'));
}
function kaiMissing(){
  const ids = new Set(state.games.map(g => g.id));
  return state.kai.ids.filter(id => !ids.has(id)).length;
}
function kaiOn(){ return !!(state.kai.on && kaiGames().length); }
/* さがす・おまかせ などで つかう ゲームの あつまり */
function poolGames(){ return kaiOn() ? kaiGames() : ownedGames(); }
function kaiPlayersText(list){
  if(!list.length) return '';
  const lo = Math.min(...list.map(g => Number(g.playersMin)||1));
  const hi = Math.max(...list.map(g => Number(g.playersMax)||1));
  return lo === hi ? lo+'人' : lo+'〜'+hi+'人';
}
function kaiShareUrl(){
  const base = publicUrl();
  if(!base) return '';
  return base + '?kai=' + state.kai.ids.join('.') + '&kn=' + encodeURIComponent(state.kai.name || '');
}
function kaiShareText(){
  const list = kaiGames();
  const url = kaiShareUrl();
  return '【' + kaiName() + '】もっていく ゲーム（' + list.length + '）\n' +
    list.map(g => '・' + g.title + '（' + playersText(g) + '・' + (Number(g.playTime)||0) + '分）').join('\n') +
    (url ? '\n\nにんずう・じかんで さがせる：\n' + url : '');
}
/* リンクで ひらかれたら、その たなを つかう */
function adoptKaiFromUrl(){
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const raw = q.get('kai');
  if(!raw) return;

/* ---------------- けんさく用の 文字ならし ----------------
   ひらがな・カタカナ・全角/半角・大文字小文字の ちがいを むしして
   おなじ ものとして あつかう。漢字は「よみがな」欄で ひろう。 */
function normalizeText(str){
  let t = String(str == null ? '' : str);
  if(t.normalize) t = t.normalize('NFKC');          /* 全角英数→半角、半角カナ→全角 */
  t = t.toLowerCase();
  /* カタカナ → ひらがな */
  t = t.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  /* 長音・記号・空白は むし */
  t = t.replace(/[ー・\s\u3000！!？?、。，．,\.:：;；~〜\-—–_（）\(\)「」『』【】\[\]"'＆&]/g, '');
  return t;
}
function searchIndex(g){
  return normalizeText([
    g.title, g.reading || '', g.summary || '', (g.tags||[]).join(' ')
  ].join(' '));
}

/* ---------------- 検索ロジック ---------------- */
function timeScore(playTime, optId){
  const t = Number(playTime)||0;
  if(optId === '15') return t <= 15 ? 1 : (t <= 22 ? .6 : 0);
  if(optId === '30') return (t >= 22 && t <= 38) ? 1 : ((t >= 15 && t <= 48) ? .6 : 0);
  if(optId === '45') return (t >= 38 && t <= 52) ? 1 : ((t >= 30 && t <= 65) ? .6 : 0);
  if(optId === '60') return t >= 60 ? 1 : (t >= 48 ? .6 : 0);
  return 0;
}
function playersCount(f){
  if(f.playersExact) return Number(f.playersExact);
  if(f.players === '6') return Math.min(30, Math.max(6, Number(f.playersN)||6));
  return Number(f.players);
}
/* 「きょうは 4人」を きめて いれば、にんずうを えらんで いなくても それを つかう */
function activeFilters(){
  const f = state.filters;
  if(!f.players && state.today){
    return {time:f.time, players:'today', playersExact:state.today, playersN:f.playersN, tags:f.tags, viaToday:true};
  }
  return f;
}
/* にんずうの しぼりこみ かた
   exact … その にんずう ちょうどで あそべる（これまで どおり）
   range … えらんだ にんずうの はばの どれかで あそべる
           （れい：3〜5人 で しぼると、4人しか だめな ゲームも でて くる） */
function playersOk(g, f){
  if(f.playersMode === 'range' && f.playersTo){
    const lo = Math.min(playersCount(f), Number(f.playersTo));
    const hi = Math.max(playersCount(f), Number(f.playersTo));
    /* ゲームの あそべる はばと、えらんだ はばが かさなれば OK */
    return g.playersMin <= hi && lo <= g.playersMax;
  }
  const n = playersCount(f);
  return g.playersMin <= n && n <= g.playersMax;
}
function scoreGame(g, f){
  let got = 0, max = 0, hardOk = true;
  if(f.players){ max += 1; if(playersOk(g, f)) got += 1; else hardOk = false; }
  if(f.time){
    max += 1;
    const s = timeScore(g.playTime, f.time);
    got += s;
    if(s === 0) hardOk = false;
  }
  if(f.tags.length){
    max += f.tags.length;
    const hit = f.tags.filter(t => (g.tags||[]).includes(t)).length;
    got += hit;
    if(hit < f.tags.length) hardOk = false;
  }
  return { game:g, rate: max === 0 ? 1 : got/max, perfect:hardOk };
}
function search(f){
  const scored = poolGames().map(g => scoreGame(g, f));
  const by = (a,b) => b.rate - a.rate || (a.game.difficulty||0) - (b.game.difficulty||0);
  return {
    perfect: scored.filter(s=>s.perfect).sort(by).map(s=>s.game),
    near: scored.filter(s=>!s.perfect && s.rate >= 0.5).sort(by).map(s=>s.game)
  };
}
function hasFilter(f){ return !!(f.time || f.players || f.tags.length); }
function condText(f){
  const c = [];
  if(f.players){
    if(f.playersMode === 'range' && f.playersTo){
      const lo = Math.min(playersCount(f), Number(f.playersTo));
      const hi = Math.max(playersCount(f), Number(f.playersTo));
      c.push(lo+'〜'+hi+'人');
    }else{
      c.push((f.players === '6' || f.players === 'today') ? playersCount(f)+'人'
             : (PLAYER_OPTIONS.find(o=>o.id===f.players)||{}).label);
    }
  }
  if(f.time) c.push((TIME_OPTIONS.find(o=>o.id===f.time)||{}).label);
  c.push(...f.tags);
  return c.join('・');
}

/* きろく用の しゃしんは 小さめに する（ながい へん 640px・しつ 65%）。
   はこ画像は これまで どおり 900px・72%。 */
const PLAY_PHOTO = {max:640, quality:0.65, limit:2};

function readImage(file, maxSize, quality){
  maxSize = maxSize || 900;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode'));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  timerEndAt = 0;

/* setInterval は 画面を みて いない あいだ 止まったり おそく なったり する。
   おわる 時こくを おぼえて おき、いつも 時計と くらべて のこりを だす。 */
function tickTimer(){
  if(!timerEndAt) return;
  const left = Math.max(0, Math.round((timerEndAt - Date.now()) / 1000));
  timerLeft = left;
  paintTimer();
  if(left <= 0 && !timerDone){
    timerDone = true;
    stopTimer();
    playTimerSe();
    toast('じかんです！');
  }
}
function startTimer(minutes){
  if(!timerLeft) timerLeft = Math.round(Number(minutes||30) * 60);
  if(timerLeft <= 0) return;
  stopTimer();
  timerDone = false;
  timerEndAt = Date.now() + timerLeft * 1000;
  timerId = setInterval(tickTimer, 250);
  paintTimer();
}
function resetTimer(minutes){
  stopTimer();
  timerDone = false;
  timerLeft = Math.round(Number(minutes||30) * 60);
  paintTimer();
}

/* ---------------- YouTube の どうが ----------------
   いろいろな かたちの URL から、どうがの ID だけを とりだす。
   さいしょは 画像だけ おいて、タップした ときに はじめて
   どうがを よみこむ（つうしん量の せつやくと 表示の はやさのため）。 */
function youtubeId(url){
  const u = String(url || '').trim();
  if(!u) return '';
  const patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([A-Za-z0-9_-]{11})/,
    /(?:youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([A-Za-z0-9_-]{11})/
  ];
  for(const re of patterns){
    const m = u.match(re);
    if(m) return m[1];
  }
  if(/^[A-Za-z0-9_-]{11}$/.test(u)) return u;   /* IDだけ はりつけた ばあい */
  return '';
}
/* 1つの ゲームに どうがを 何本でも つけられる。
   ふるい データ（video が 1本だけ）も そのまま よめる ように する。 */
function videosOf(g){
  const list = Array.isArray(g.videos) ? g.videos.slice() : [];
  if(!list.length && g.video) list.push(g.video);
  return list.filter(u => youtubeId(u));
}
function videoHTML(g){
  const list = videosOf(g);
  if(!list.length) return '';
  return '<div class="section"><h2>どうがで みる'+(list.length>1?'（'+list.length+'本）':'')+'</h2>' +
    list.map((u, i) => {
      const id = youtubeId(u);
      return '<div style="margin-bottom:'+(i === list.length-1 ? '0' : '14px')+'">' +
        '<div class="video-box" data-vid="'+esc(id)+'">' +
          '<img src="https://i.ytimg.com/vi/'+esc(id)+'/hqdefault.jpg" alt="" loading="lazy">' +
          '<button class="video-play" data-videoplay="'+i+'" aria-label="どうがを さいせい">▶</button>' +
        '</div>' +
        '<p class="count" style="margin:6px 0 0">タップで さいせい。' +
        '<a href="https://www.youtube.com/watch?v='+esc(id)+'" target="_blank" rel="noopener">YouTubeで ひらく</a></p>' +
      '</div>';
    }).join('') +

}

/* ---------------- にた ゲーム ---------------- */
function similarGames(g){
  const tags = g.tags || [];
  if(!tags.length) return [];
  return ownedGames()
    .filter(x => x.id !== g.id)
    .map(x => {
      const hit = (x.tags||[]).filter(t => tags.includes(t)).length;
      const near = Math.abs((x.playTime||0) - (g.playTime||0)) <= 20 ? 0.5 : 0;
      return {g:x, score: hit + near};
    })
    .filter(x => x.score >= 1.5)   /* タグ1つ＋じかんが ちかい でも こうほに する */
    .sort((a,b) => b.score - a.score || a.g.title.localeCompare(b.g.title,'ja'))
    .slice(0,3)
    .map(x => x.g);
}

/* ---------------- あいうえお の わけかた ---------------- */
const KANA_ROWS = [['あ','あいうえおぁぃぅぇぉゔ'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],
  ['た','たちつてとだぢづでどっ'],['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],
  ['ま','まみむめも'],['や','やゆよゃゅょ'],['ら','らりるれろ'],['わ','わをんゎ']];
const KANA_ABC = 'A〜Z', KANA_OTHER = 'ほか';
function toHira(str){ return String(str || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
/* ならべる ときの よみ：よみがな → なまえの（カナ）→ なまえ */
function readKey(g){
  let s = String(g.reading || '').trim();
  if(!s){
    const m = String(g.title || '').match(/[（(]\s*([ぁ-んァ-ヶー・\s]+?)\s*[)）]/);
    s = (m && !/^[ぁ-んァ-ヶー]/.test(String(g.title || '').trim())) ? m[1] : String(g.title || '');
  }
  return toHira(s.trim()).toLowerCase();
}
function kanaGroup(g){
  const ch = readKey(g).charAt(0);
  for(const row of KANA_ROWS) if(row[1].indexOf(ch) >= 0) return row[0];
  if(/[a-z0-9]/i.test(ch) || /[ａ-ｚＡ-Ｚ０-９]/.test(ch)) return KANA_ABC;
  return KANA_OTHER;
}
function kanaGroupIndex(g){
  const k = kanaGroup(g);
  const i = KANA_ROWS.findIndex(r => r[0] === k);
  return i >= 0 ? i : (k === KANA_ABC ? 10 : 11);
}
function bindKanaJump(root){
  (root || app).querySelectorAll('[data-kana]').forEach(b => b.onclick = () => {
    const el = document.getElementById('kana-' + b.dataset.kana);
    if(!el) return;
    const bar = document.querySelector('.kana-jump');
    const top = el.getBoundingClientRect().top + window.scrollY - 62 - (bar ? bar.offsetHeight : 0) - 6;
    window.scrollTo({top: Math.max(0, top), behavior:'smooth'});
  });
}

}

/* ---------------- ねむっている たからばこ ----------------
   しばらく あそんで いない ゲームを、たなの おくから ほりおこす。 */
const SLEEP_DAYS = 60;
function sleepDays(g){
  const last = lastPlayed(g);
  if(!last) return null;          /* まだ いちども あそんで いない */
  return daysAgo(last);
}
function sleepingGames(){
  return poolGames().filter(g => {
    if(isLent(g) || isNewArrival(g)) return false;
    const d = sleepDays(g);
    return d === null || d >= SLEEP_DAYS;
  }).sort((a,b) => {
    const da = sleepDays(a), db = sleepDays(b);
    /* 1かいでも あそんだ ことが ある ゲームを さきに（なつかしい じゅん）、つぎに まだ あそんで いない もの */
    if(da === null && db === null) return readKey(a).localeCompare(readKey(b),'ja');
    if(da === null) return 1;
    if(db === null) return -1;
    return db - da;
  });
}
function sleepLabel(g){
  const d = sleepDays(g);
  return d === null ? 'まだ あそんで いない' : d + '日 あそんで いない';
}
function sleepBadge(g){
  return state.listMode === 'sleep' && currentRoute().name === 'list'
    ? '<span class="badge" style="border-color:var(--accent-2);color:var(--accent-2)">' + esc(sleepLabel(g)) + '</span>' : '';
}
function treasureHTML(){
  const all = sleepingGames();
  if(ownedGames().length < 5 || !all.length) return '';
  const napped = all.filter(g => sleepDays(g) !== null);
  const pool = napped.length ? napped : all;
  const seed = todayStr().split('-').join('') * 1;
  const g = pool[(seed + (state.treasureShift || 0)) % pool.length];
  return '<div class="divider"></div>' +
    '<p class="count" style="margin:0 0 6px;color:var(--accent-2)">ねむっている たからばこ<span class="hint">しばらく あそんで いない ゲーム</span></p>' +
    '<div class="btn-row" style="gap:8px">' +
      '<button class="btn small" data-open="' + esc(g.id) + '" style="flex:1;min-width:0;justify-content:flex-start;text-align:left">' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">▶ ' + esc(g.title) +
        ' <span style="color:var(--muted);font-size:11px">' + esc(sleepLabel(g)) + '</span></span></button>' +
      (pool.length > 1 ? '<button class="btn small" id="treasureNext" style="flex:0 0 auto">べつの はこ</button>' : '') +
    '</div>' +
    '<p class="count" style="margin:6px 0 0;text-align:right"><button class="mini" id="treasureAll">ねむっている ゲームを ぜんぶ みる（' + all.length + '）</button></p>';
}

/* 一覧は「けんさく欄」と「けっか」を わけて 持つ。
   文字を うっている あいだ 画面ぜんたいを 作りなおすと、
   iPhone の 予測変換（IME）が とちゅうで きえて しまうため、
   けっかの ぶぶんだけを 入れかえる。 */
function listComputed(){
  const f = activeFilters();
  const mode = state.listMode;
  const filtered = mode === 'own' && hasFilter(f);
  const keepOrder = (mode === 'req' || mode === 'new' || mode === 'sleep');
  const res = search(f);
  let list;
  if(mode === 'new')       list = newArrivals();
  else if(mode === 'req')  list = requestedGames();
  else if(mode === 'wish') list = state.games.filter(isWish);
  else if(mode === 'lent') list = ownedGames().filter(isLent);
  else if(mode === 'sleep') list = sleepingGames();
  else                     list = filtered ? res.perfect.slice() : poolGames();
  list = list.slice();

  const q = normalizeText(state.listQuery);
  if(q) list = list.filter(g => searchIndex(g).includes(q));

  if((!filtered || q) && !keepOrder){
    const sk = state.listSort;
    list.sort((a,b) =>
      sk === 'time' ? (a.playTime-b.playTime) :
      sk === 'players' ? (a.playersMin-b.playersMin) :
      sk === 'difficulty' ? (a.difficulty-b.difficulty) :
      sk === 'recent' ? (lastPlayed(b) || '').localeCompare(lastPlayed(a) || '') :
      sk === 'sleeping' ? ((lastPlayed(a) || '') .localeCompare(lastPlayed(b) || '') || playCount(a)-playCount(b)) :
      sk === 'replay' ? ((Number(b.replay)||0) - (Number(a.replay)||0)) :
      sk === 'excitement' ? ((Number(b.excitement)||0) - (Number(a.excitement)||0)) :
      sk === 'plays' ? (playCount(b) - playCount(a)) :
      (kanaGroupIndex(a) - kanaGroupIndex(b)) || readKey(a).localeCompare(readKey(b),'ja') || a.title.localeCompare(b.title,'ja'));
  }
  return {f, filtered, res, list, q};
}

function listResultsHTML(){
  const c = listComputed();
  const f = c.f, list = c.list, res = c.res;

  let html = '<p class="count">' +
    (c.filtered ? esc(condText(f)) + ' の じょうけんで ' + list.length + 'さくひん'
                : 'ぜんぶで ' + list.length + 'さくひん') +
    (c.q ? '（「' + esc(state.listQuery) + '」で けんさく中）' : '') +
    (c.filtered ? ' <button class="mini" id="clearFilter" style="margin-left:6px">じょうけんを けす</button>' : '') +
    '</p>';

  if(!list.length && !res.near.length){
    html += '<div class="empty"><span class="mark" data-icon="search"></span>' +
      (c.q ? 'その なまえの ゲームは みつからない！<br><span style="font-size:12px">べつの よみかたや、みじかい ことばで ためして みてください。</span>'
           : 'じょうけんに あう ゲームが みつからない！<br><span style="font-size:12px">じょうけんを ひとつ へらすと みつかりやすい。</span>') +
      '<div style="margin-top:16px"><button class="btn small" data-go2="#/">じょうけんを えらびなおす</button></div></div>';
    return html;
  }

  const block = arr => (state.listView === 'grid')
      ? '<div class="tile-grid">' + arr.map(g => gameTile(g)).join('') + '</div>'
      : '<div class="card-list">' + arr.map(g => gameCard(g, f.tags)).join('') + '</div>';
  if(state.listMode === 'sleep' && list.length){
    html += '<p class="count" style="margin:-4px 0 12px">' + SLEEP_DAYS + '日いじょう あそんで いない ゲームです。' +
      'さいごに あそんだ 日が ふるい じゅんに、そのあと まだ いちども あそんで いない ゲームを ならべて います。</p>';
  }
  /* なまえ順の ときは「あいうえお」で わけて、とびさき ボタンを だす */
  const useIndex = false;   /* あいうえお の みだしは つかわない */
  if(list.length && useIndex){
    const groups = [];
    list.forEach(g => {
      const k = kanaGroup(g);
      let last = groups[groups.length - 1];
      if(!last || last.k !== k){ last = {k, items:[]}; groups.push(last); }
      last.items.push(g);
    });
    html += '<div class="kana-jump">' + groups.map((gr, i) =>
      '<button type="button" data-kana="'+i+'">'+esc(gr.k)+'</button>').join('') + '</div>' +
      groups.map((gr, i) =>
        '<h3 class="kana-h" id="kana-'+i+'">'+esc(gr.k)+' <span class="hint">'+gr.items.length+'</span>' +
        (gr.k === KANA_OTHER ? '<span class="hint">　よみがなを いれると ただしい ぎょうに ならびます</span>' : '') + '</h3>' +
        block(gr.items)).join('');
  }else if(list.length){
    html += block(list);
  }
  else html += '<div class="note" style="margin-bottom:14px">ぴったりの ゲームは いなかった。ちかい ゲームを だします。</div>';

  if(c.filtered && res.near.length && !c.q){
    html += '<div class="divider"></div><h2 class="sec">じょうけんに ちかい ゲーム</h2>' +
      '<p class="count">じょうけんを ひとつ はずすと こうほに なります。</p>' +
      '<div class="card-list">' + res.near.slice(0,6).map(g => gameCard(g, f.tags)).join('') + '</div>';
  }
  return html;
}

/* ---------------- とうけい ---------------- */
function barRow(label, value, max, note){
  const w = max > 0 ? Math.round(value / max * 100) : 0;
  return '<div style="margin-bottom:7px">' +
    '<div style="display:flex;justify-content:space-between;font-size:12.5px">' +
      '<span>'+esc(label)+'</span><span style="color:var(--muted)">'+value+(note||'')+'</span></div>' +
    '<div style="height:10px;border:2px solid var(--frame);background:var(--bg-2)">' +
      '<div style="height:100%;width:'+w+'%;background:var(--accent)"></div></div></div>';
}
function viewStats(){
  const own = ownedGames();
  const total = own.length;
  if(!total) return '<section class="page"><h1 class="lede">とうけい</h1><div class="empty">まだ ゲームが ありません</div></section>';

  const byPlayers = [2,3,4,5,6,7,8].map(n => ({
    n, c: own.filter(g => g.playersMin <= n && n <= g.playersMax).length
  }));
  const maxP = Math.max.apply(null, byPlayers.map(x => x.c));

  const timeBuckets = [
    ['15分いない', g => g.playTime <= 15],
    ['16〜30分',   g => g.playTime > 15 && g.playTime <= 30],
    ['31〜45分',   g => g.playTime > 30 && g.playTime <= 45],
    ['46〜60分',   g => g.playTime > 45 && g.playTime <= 60],
    ['60分いじょう', g => g.playTime > 60]
  ].map(b => ({label:b[0], c: own.filter(b[1]).length}));
  const maxT = Math.max.apply(null, timeBuckets.map(x => x.c));

  const byDiff = [1,2,3,4,5].map(d => ({d, c: own.filter(g => Number(g.difficulty) === d).length}));
  const maxD = Math.max.apply(null, byDiff.map(x => x.c));

  const tagCount = {};
  own.forEach(g => (g.tags||[]).forEach(t => { tagCount[t] = (tagCount[t]||0) + 1; }));
  const topTags = Object.keys(tagCount).map(k => ({t:k, c:tagCount[k]}))
    .sort((a,b) => b.c - a.c).slice(0,8);
  const maxTag = topTags.length ? topTags[0].c : 0;

  const played = own.filter(g => playCount(g) > 0);
  const totalPlays = own.reduce((n,g) => n + playCount(g), 0);
  const never = total - played.length;
  const mostPlayed = own.slice().sort((a,b) => playCount(b) - playCount(a)).slice(0,3).filter(g => playCount(g) > 0);
  const sleeping = own.filter(g => !playCount(g)).slice(0,5);
  const need = own.filter(needsData).length;
  const lent = own.filter(isLent).length;
  const wish = state.games.filter(isWish).length;

  return '<section class="page">' +
    '<button class="mini" data-go2="#/admin" style="margin-bottom:14px">◀ かんりへ もどる</button>' +
    '<h1 class="lede">ずかんの とうけい</h1>' +
    '<p class="sub">もっている '+total+'さくひん／あそんだ きろく '+totalPlays+'かい</p>' +

    '<div class="section"><h2>にんずう べつに あそべる かず</h2>' +
      byPlayers.map(x => barRow(x.n+'人', x.c, maxP, 'さくひん')).join('') + '</div>' +

    '<div class="section"><h2>あそぶ じかん</h2>' +
      timeBuckets.map(x => barRow(x.label, x.c, maxT, 'さくひん')).join('') + '</div>' +

    '<div class="section"><h2>むずかしさ</h2>' +
      byDiff.map(x => barRow('★'.repeat(x.d), x.c, maxD, 'さくひん')).join('') + '</div>' +

    (topTags.length ? '<div class="section"><h2>おおい タグ</h2>' +
      topTags.map(x => barRow(x.t, x.c, maxTag, 'さくひん')).join('') + '</div>' : '') +

    '<div class="section"><h2>あそんだ ようす</h2>' +
      '<dl class="kv">' +
        '<dt>あそんだ</dt><dd>'+played.length+'さくひん</dd>' +
        '<dt>まだ の もの</dt><dd>'+never+'さくひん</dd>' +
        '<dt>かしだし中</dt><dd>'+lent+'さくひん</dd>' +
        '<dt>ほしいもの</dt><dd>'+wish+'さくひん</dd>' +
        '<dt>データ みきにゅう</dt><dd>'+need+'さくひん</dd>' +
      '</dl>' +
      (mostPlayed.length ? '<p class="count" style="margin:10px 0 0">よく あそぶ：' +
        mostPlayed.map(g => esc(g.title)+'（'+playCount(g)+'かい）').join('、') + '</p>' : '') +
      (sleeping.length ? '<p class="count" style="margin:6px 0 0">まだ あそんで いない：' +
        sleeping.map(g => esc(g.title)).join('、') + ' ほか</p>' : '') +
    '</div>' +

    (need ? '<button class="btn primary" data-go2="#/bulk">みきにゅうの '+need+'さくひんを うめる</button>' : '') +
  '</section>';
}
